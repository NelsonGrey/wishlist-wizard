  <!-- Google Consent Mode v2: deny all by default before any tag fires -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      functionality_storage: 'denied',
      personalization_storage: 'denied',
      security_storage: 'granted'
    });
    // Restore previously saved consent on page load so returning visitors
    // don't see the banner again and tags fire immediately.
    try {
      var _c = JSON.parse(localStorage.getItem('ww_consent') || 'null');
      if (_c && _c.decided) {
        gtag('consent', 'update', {
          analytics_storage: _c.analytics ? 'granted' : 'denied',
          functionality_storage: _c.analytics ? 'granted' : 'denied',
          personalization_storage: _c.analytics ? 'granted' : 'denied',
          ad_storage: _c.marketing ? 'granted' : 'denied',
          ad_user_data: _c.marketing ? 'granted' : 'denied',
          ad_personalization: _c.marketing ? 'granted' : 'denied'
        });
      }
    } catch(e) {}
  </script>
