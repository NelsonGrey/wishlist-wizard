<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishKeeper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      width: 400px;
      min-height: 580px;
      background-color: #ffffff;
      color: #374151;
    }
    
    /* Typography */
    h1, h2, h3, h4 {
      margin: 0;
      color: #111827;
    }
    
    /* Header */
    .header {
      background-color: #4F46E5;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: white;
    }
    
    /* Actions Bar */
    .actions {
      padding: 16px;
      background-color: #F9FAFB;
      border-bottom: 1px solid #E5E7EB;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    /* Buttons */
    .btn {
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background-color: #4F46E5;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #4338CA;
    }
    
    .btn-secondary {
      background-color: white;
      color: #374151;
      border: 1px solid #D1D5DB;
    }
    
    .btn-secondary:hover {
      background-color: #F9FAFB;
    }
    
    .btn svg {
      margin-right: 4px;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid #E5E7EB;
    }
    
    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      font-weight: 500;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #6B7280;
      transition: color 0.2s;
    }
    
    .tab-btn.active {
      color: #4F46E5;
      border-bottom: 2px solid #4F46E5;
    }
    
    .tab-btn:hover:not(.active) {
      color: #374151;
    }
    
    /* Lists */
    .list-item {
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .list-item:hover {
      background-color: #F9FAFB;
    }
    
    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .list-item-title {
      font-weight: 500;
      font-size: 16px;
      color: #111827;
    }
    
    .list-item-count {
      font-size: 14px;
      color: #6B7280;
      margin-top: 4px;
    }
    
    .list-item-actions {
      display: flex;
      gap: 4px;
    }
    
    .icon-btn {
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 9999px;
      color: #6B7280;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .icon-btn:hover {
      background-color: #E5E7EB;
      color: #111827;
    }
    
    /* Wish Item List */
    .wish-item {
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
      transition: background-color 0.2s;
    }
    
    .wish-item:hover {
      background-color: #F9FAFB;
    }
    
    .wish-item-content {
      display: flex;
      gap: 12px;
    }
    
    .wish-item-image {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
    }
    
    .wish-item-details {
      flex: 1;
    }
    
    .wish-item-title {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .wish-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    
    .wish-item-price {
      font-weight: 600;
      font-size: 14px;
    }
    
    .wish-item-store {
      font-size: 12px;
      color: #6B7280;
      margin-left: 4px;
    }
    
    /* Detailed list view */
    .detailed-list-header {
      padding: 16px;
      background-color: #F9FAFB;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .detailed-list-title {
      font-size: 18px;
      font-weight: 500;
    }
    
    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background-color: #4F46E5;
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      opacity: 0;
      transform: translateY(100%);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background-color: white;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid #E5E7EB;
    }
    
    .modal-body {
      padding: 16px;
    }
    
    .modal-footer {
      padding: 16px;
      background-color: #F9FAFB;
      border-top: 1px solid #E5E7EB;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }
    
    /* Form elements */
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }
    
    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #4F46E5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    
    textarea.form-control {
      resize: vertical;
      min-height: 60px;
    }
    
    /* Footer */
    .footer {
      padding: 12px;
      background-color: #F9FAFB;
      border-top: 1px solid #E5E7EB;
      text-align: center;
    }
    
    .footer a {
      color: #4F46E5;
      text-decoration: none;
      font-size: 14px;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    /* Loading spinner */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #4F46E5;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty state */
    .empty-state {
      padding: 48px 16px;
      text-align: center;
    }
    
    .empty-state-title {
      font-weight: 500;
      font-size: 16px;
      margin-bottom: 8px;
    }
    
    .empty-state-text {
      color: #6B7280;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>WishKeeper</h1>
    <button class="icon-btn" id="settings-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Main Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="add-current-item-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      Add Current Item
    </button>
    <button class="btn btn-secondary" id="create-list-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      New List
    </button>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="my-lists">My Lists</button>
    <button class="tab-btn" data-tab="recently-added">Recently Added</button>
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- My Lists Tab -->
    <div class="tab-pane active" id="my-lists-tab">
      <div id="wishlists-container">
        <!-- Lists will be populated here -->
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- Recently Added Tab -->
    <div class="tab-pane" id="recently-added-tab" style="display: none;">
      <div id="recent-items-container">
        <!-- Recent items will be populated here -->
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed List View (hidden by default) -->
  <div id="detailed-list-view" style="display: none;">
    <div class="detailed-list-header">
      <button class="icon-btn" id="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h2 class="detailed-list-title" id="detailed-list-title">List Name</h2>
      <button class="icon-btn" id="share-list-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>
    </div>
    <div id="detailed-items-container">
      <!-- Items will be populated here -->
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" target="_blank" id="open-website-btn">Open WishKeeper Website</a>
  </div>

  <!-- Add to List Modal -->
  <div class="modal" id="add-to-list-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add to Wishlist</h3>
      </div>
      <div class="modal-body">
        <div id="current-product" class="flex space-x-3 mb-4">
          <!-- Product details will go here -->
        </div>
        <div class="form-group">
          <label class="form-label" for="wishlist-select">Select a List</label>
          <select class="form-control" id="wishlist-select">
            <!-- Wishlists will be populated here -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="note-input">Add a Note (Optional)</label>
          <textarea class="form-control" id="note-input" rows="2" placeholder="Example: Color preference, size, etc."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-add-btn">Cancel</button>
        <button class="btn btn-primary" id="confirm-add-btn">Add to List</button>
      </div>
    </div>
  </div>

  <!-- Create List Modal -->
  <div class="modal" id="create-list-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create New Wishlist</h3>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="list-name-input">Wishlist Name</label>
          <input type="text" class="form-control" id="list-name-input" placeholder="e.g., Birthday Wishlist">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-create-btn">Cancel</button>
        <button class="btn btn-primary" id="confirm-create-btn">Create Wishlist</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toast-message">Item added to wishlist</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
