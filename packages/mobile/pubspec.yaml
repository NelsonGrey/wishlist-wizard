name: wishlist_wizard_mobile
description: "Wishlist Wizard Mobile App - Flutter version"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.2
  firebase_data_connect: ^0.3.0+7
  firebase_messaging: ^16.0.3

  # Local Storage
  shared_preferences: ^2.3.2

  # Authentication & Security
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^8.1.0
  
  # Image & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # UI Components
  flutter_svg: ^2.0.10+1
  
  # Notifications
  flutter_local_notifications: ^22.1.0
  
  # Advertising
  google_mobile_ads: ^9.1.0
  webview_flutter_wkwebview: ^3.23.0

  # Live barcode camera scanning (scan_item_screen.dart). A GTMSessionFetcher
  # conflict with Firebase previously blocked this package -- verified
  # 2026-08-12 that current versions of both resolve and pod-install cleanly
  # together, so it's no longer blocked.
  mobile_scanner: ^7.1.2

  # In-App Purchase (native StoreKit/Play Billing subscriptions)
  in_app_purchase: ^3.2.0

  # Contacts (native picker for inviting collaborators — the picker UI
  # itself is permissionless, but the properties fetch that follows needs
  # NSContactsUsageDescription on iOS and READ_CONTACTS on Android; see
  # Info.plist / AndroidManifest.xml)
  # Pinned below latest: 2.x is a complete API rewrite (requestPermission()
  # and openExternalPick(), both used in connections_screen.dart and
  # invite_collaborator_dialog.dart, were removed entirely, replaced with a
  # different low-level contact CRUD API) that broke compilation the moment
  # Dependabot's #166 auto-merged it. Reverted 2026-08-27; upgrading to 2.x
  # needs a deliberate rewrite of the contacts integration, not a bump.
  flutter_contacts: ^2.3.1

  # Group gifting (real Stripe card payments — see
  # packages/functions/src/api/groupPayments.ts). CardField + confirmPayment
  # only; native Apple Pay / Google Pay wallets aren't wired up.
  flutter_stripe: ^14.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^12.0.0
  logging: ^1.3.0

  # Calendar-provider OAuth (Google/Outlook/Facebook connect flow) — launches
  # an ASWebAuthenticationSession (iOS) / Custom Tab (Android) against the
  # provider's auth URL and suspends until it redirects to the
  # wishlistwizard://calendar-callback scheme registered in
  # Info.plist/AndroidManifest.xml, returning the full callback URL.
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  # Transitive via firebase_auth, but password_policy_service_test.dart
  # constructs PasswordPolicy fixtures directly (firebase_auth doesn't
  # re-export that type, only PasswordValidationStatus) -- listed explicitly
  # per the depend_on_referenced_packages lint.
  firebase_auth_platform_interface: ^9.0.5
  # Transitive via url_launcher, but creator_dashboard_screen_test.dart
  # installs a fake UrlLauncherPlatform so the "set up payouts" button's
  # launchUrl call resolves instead of hanging on the real platform
  # channel under test -- listed explicitly per the same lint as above.
  url_launcher_platform_interface: ^2.3.2
  # Transitive via share_plus, but social_share_service_test.dart installs
  # a fake SharePlatform so Share.share() calls resolve (and are
  # inspectable) instead of hanging on the real platform channel under
  # test -- listed explicitly per the same lint as above.
  share_plus_platform_interface: ^6.1.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Installed-app launcher icon, generated from the brand logo
# (packages/web/public/logo.svg -> assets/icon/*.png). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#004E36"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo.svg

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
