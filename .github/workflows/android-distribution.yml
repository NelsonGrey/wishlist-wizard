# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Android App Distribution

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to distribute'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      release_notes:
        description: 'Release notes for this build'
        required: false
        type: string

jobs:
  distribute-android:
    runs-on: self-hosted
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android platform files
        run: |
          cd packages/mobile
          flutter create --platforms=android --org=com.nelsongrey.wishlistwizard.mobile .

      - name: Create service account key file
        env:
          SERVICE_ACCOUNT_KEY: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION || github.ref == 'refs/heads/staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT_DEVELOPMENT }}
        run: |
          mkdir -p packages/mobile/android/app
          echo "$SERVICE_ACCOUNT_KEY" > packages/mobile/android/app/service-account-key.json

      - name: Make distribution script executable
        run: |
          # Create Android distribution script if it doesn't exist
          if [ ! -f "packages/mobile/distribute-android.sh" ]; then
            printf '#!/bin/bash\nset -e\n\nBUILD_TYPE=$1\nRELEASE_NOTES=$2\n\necho "Building Android app with type: $BUILD_TYPE"\n\n# Build Android APK\nflutter build apk --$BUILD_TYPE\n\n# For now, just create a placeholder for distribution\n# TODO: Implement actual distribution to Google Play Store\necho "Android build completed. Manual distribution to Google Play required."\necho "APK location: build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk"\n' > packages/mobile/distribute-android.sh
            chmod +x packages/mobile/distribute-android.sh
          fi

      - name: Build and distribute Android app
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
        run: |
          cd packages/mobile
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_NOTES="${{ github.event.inputs.release_notes || format('Build from {0} - {1}', github.ref_name, github.sha) }}"
          else
            RELEASE_NOTES="Build from ${{ github.ref_name }} - ${{ github.sha }}"
          fi
          ./distribute-android.sh "$BUILD_TYPE" "$RELEASE_NOTES"

      - name: Clean up service account key
        if: always()
        run: rm -f packages/mobile/android/app/service-account-key.json