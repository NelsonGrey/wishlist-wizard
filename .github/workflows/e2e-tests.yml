name: E2E Tests - Website Readiness

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Run tests daily at 2 AM ET on dev environment
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke Test (Dev Environment)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests against dev environment
        run: npm run test:e2e:smoke
        env:
          TEST_URL: https://wishlist-wizard-dev.web.app
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  tier1-tests:
    name: Tier 1 Tests (Basic Features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Tier 1 tests against staging
        run: npm run test:e2e:tier1
        env:
          TEST_URL: https://wishlist-wizard-staging.web.app
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier1
          path: playwright-report/
          retention-days: 7

  tier2-tests:
    name: Tier 2 Tests (Advanced Features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Tier 2 tests against staging
        run: npm run test:e2e:tier2
        env:
          TEST_URL: https://wishlist-wizard-staging.web.app
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier2
          path: playwright-report/
          retention-days: 7

  e2e-production-smoke:
    name: Production Smoke Test (Daily)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests against production
        run: npm run test:e2e:prod
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Production smoke test failed! Check the E2E test report.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Smoke Test Failed*\nEnvironment: wishlist-wizard.web.app\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                  }
                }
              ]
            }

test-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.smoke-test.result }}" == "failure" ]; then
            echo "❌ Smoke tests failed!"
            exit 1
          else
            echo "✅ All smoke tests passed!"
          fi
