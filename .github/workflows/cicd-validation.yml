name: CI/CD Pipeline Validation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate'
        required: false
        default: 'DEVELOPMENT'
        type: choice
        options:
        - DEVELOPMENT
        - STAGING
        - PRODUCTION
      validate_ios:
        description: 'Validate iOS build'
        required: false
        default: true
        type: boolean
      validate_android:
        description: 'Validate Android build'
        required: false
        default: true
        type: boolean
      validate_security:
        description: 'Run security scans'
        required: false
        default: true
        type: boolean

jobs:
  validate-ios:
    if: github.event.inputs.validate_ios == 'true' || github.event.inputs.validate_ios == ''
    runs-on: [self-hosted, macos-latest, wishlist-wizard]
    environment: ${{ github.event.inputs.environment || 'DEVELOPMENT' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate iOS environment setup
        run: |
          echo "🍎 Validating iOS build environment..."
          echo "Ruby version: $(ruby --version)"
          echo "Fastlane version: $(fastlane --version 2>/dev/null || echo 'Fastlane not installed')"
          echo "Flutter version: $(flutter --version | head -1)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Install GMP library (required for Ruby 3.2.2)
        run: brew install gmp

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install Fastlane
        run: gem install fastlane -v 2.228.0

      - name: Validate iOS secrets availability
        run: |
          echo "🔐 Checking iOS secrets availability..."
          SECRETS=("FASTLANE_APPLE_ID" "FASTLANE_TEAM_ID" "ASC_KEY_ID" "ASC_PRIVATE_KEY" "MATCH_GIT_URL")
          MISSING_SECRETS=()

          for secret in "${SECRETS[@]}"; do
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            else
              echo "✅ $secret: Available"
            fi
          done

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing secrets: ${MISSING_SECRETS[*]}"
            exit 1
          fi

      - name: Test iOS build setup
        run: |
          cd packages/mobile
          flutter create --platforms=ios --org=com.nelsongrey.wishlistwizard.mobile .

          cd ios
          # Test Fastlane configuration without actually building
          echo "Testing Fastlane configuration..."
          fastlane --version

          # Validate Appfile configuration
          if [ -f fastlane/Appfile ]; then
            echo "✅ Appfile exists"
          else
            echo "❌ Appfile missing"
            exit 1
          fi

      - name: Validate keychain setup
        run: |
          echo "🔑 Testing keychain setup..."
          if [ -f scripts/setup_keychain.sh ]; then
            echo "✅ Keychain setup script exists"
            chmod +x scripts/setup_keychain.sh
            # Test script syntax without creating keychain
            bash -n scripts/setup_keychain.sh && echo "✅ Keychain script syntax OK"
          else
            echo "❌ Keychain setup script missing"
            exit 1
          fi

      - name: Validate ephemeral keychain helper
        run: |
          echo "🔑 Validating ephemeral keychain helper script..."
          if [ -f scripts/ephemeral_keychain_fastlane.sh ]; then
            chmod +x scripts/ephemeral_keychain_fastlane.sh
            bash -n scripts/ephemeral_keychain_fastlane.sh && echo "✅ Ephemeral helper syntax OK"
          else
            echo "⚠️ Ephemeral helper script missing. Recommend adding scripts/ephemeral_keychain_fastlane.sh"
            # Do not fail validation; optional helper
          fi

  validate-android:
    if: github.event.inputs.validate_android == 'true' || github.event.inputs.validate_android == ''
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'DEVELOPMENT' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Validate Android secrets availability
        run: |
          echo "🤖 Checking Android secrets availability..."
          SECRETS=("FIREBASE_SERVICE_ACCOUNT_KEY_${{ github.event.inputs.environment || 'DEVELOPMENT' }}")
          MISSING_SECRETS=()

          for secret in "${SECRETS[@]}"; do
            if [ -z "${!secret:-}" ]; then
              MISSING_SECRETS+=("$secret")
            else
              echo "✅ $secret: Available"
            fi
          done

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing secrets: ${MISSING_SECRETS[*]}"
            exit 1
          fi

      - name: Test Android build setup
        run: |
          cd packages/mobile
          flutter create --platforms=android --org=com.nelsongrey.wishlistwizard.mobile .

          cd android
          echo "Testing Android build configuration..."
          ./gradlew --version

  validate-security:
    if: github.event.inputs.validate_security == 'true' || github.event.inputs.validate_security == ''
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks security scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [validate-ios, validate-android, validate-security]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Create validation summary
        run: |
          echo "## 🔍 CI/CD Pipeline Validation Summary" >> validation-summary.md
          echo "" >> validation-summary.md
          echo "**Date:** $(date)" >> validation-summary.md
          echo "**Environment:** ${{ github.event.inputs.environment || 'DEVELOPMENT' }}" >> validation-summary.md
          echo "**iOS Validation:** ${{ needs.validate-ios.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> validation-summary.md
          echo "**Android Validation:** ${{ needs.validate-android.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> validation-summary.md
          echo "**Security Scan:** ${{ needs.validate-security.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> validation-summary.md
          echo "" >> validation-summary.md

          if [[ "${{ needs.validate-ios.result }}" == "success" && "${{ needs.validate-android.result }}" == "success" && "${{ needs.validate-security.result }}" == "success" ]]; then
            echo "🎉 All validations passed! CI/CD pipelines are ready." >> validation-summary.md
          else
            echo "⚠️ Some validations failed. Check the individual job logs for details." >> validation-summary.md
          fi

      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        with:
          name: cicd-validation-summary
          path: validation-summary.md