# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: iOS App Distribution

# iOS builds using self-hosted macOS runner
# Automatic builds are enabled for all environments

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to distribute'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      release_notes:
        description: 'Release notes for this build'
        required: false
        type: string

jobs:
  distribute-ios:
    runs-on: [self-hosted, macos-latest, wishlist-wizard]  # Self-hosted macOS runner
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
    steps:
      - name: iOS Build Environment Check
        run: |
          echo "🍎 Running on self-hosted macOS runner"
          echo "📍 Hostname: $(hostname)"
          echo "💰 Using self-hosted runner (cost savings)"
          echo "🖥️  macOS version: $(sw_vers -productVersion)"
          echo "🛠️  Xcode version: $(xcodebuild -version | head -1)"

      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Generate iOS platform files
        run: |
          cd packages/mobile
          flutter create --platforms=ios --org=com.nelsongrey.wishlistwizard.mobile .

      - name: Create service account key file
        env:
          IOS_SERVICE_ACCOUNT_KEY: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_KEY_{0}', github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT')] }}
        run: |
          mkdir -p packages/mobile/ios
          echo "$IOS_SERVICE_ACCOUNT_KEY" > packages/mobile/ios/service-account-key.json

      - name: Set up Fastlane environment
        run: |
          cd packages/mobile/ios
          # Create Fastlane environment file
          cat > .env << EOF
          FASTLANE_APPLE_ID=${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID=${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID=${{ secrets.FASTLANE_ITC_TEAM_ID }}
          ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY=${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL=${{ secrets.MATCH_GIT_URL }}
          BETA_FEEDBACK_EMAIL=${{ secrets.BETA_FEEDBACK_EMAIL }}
          EOF

      - name: Build and distribute iOS app
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
        run: |
          cd packages/mobile/ios
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_NOTES="${{ github.event.inputs.release_notes || format('Build from {0} - {1}', github.ref_name, github.sha) }}"
          else
            RELEASE_NOTES="Build from ${{ github.ref_name }} - ${{ github.sha }}"
          fi
          
          # Export release notes for Fastlane
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV
          
          # Run Fastlane pipeline based on environment and build type
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/staging" ]] || [[ "$BUILD_TYPE" == "release" ]]; then
            # Production/Staging OR manual release: Upload to TestFlight
            fastlane beta
          else
            # Development: Just build and test
            fastlane test_and_build
          fi

      - name: Clean up service account key
        if: always()
        run: rm -f packages/mobile/ios/service-account-key.json packages/mobile/ios/.env