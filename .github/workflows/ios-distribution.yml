# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: iOS App Distribution

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to distribute'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      release_notes:
        description: 'Release notes for this build'
        required: false
        type: string

jobs:
  distribute-ios:
    runs-on: macos-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'DEVELOPMENT' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Generate iOS platform files
        run: |
          cd packages/mobile
          flutter create --platforms=ios --org=com.nelsongrey.wishlistwizard.mobile .

      - name: Create service account key file
        env:
          IOS_SERVICE_ACCOUNT_KEY: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_{0}', github.ref == 'refs/heads/main' && 'PRODUCTION' || 'DEVELOPMENT')] }}
        run: |
          mkdir -p packages/mobile/ios
          echo "$IOS_SERVICE_ACCOUNT_KEY" > packages/mobile/ios/service-account-key.json

      - name: Set up Fastlane environment
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
        run: |
          cd packages/mobile/ios
          # Export environment variables for Fastlane
          echo "FASTLANE_APPLE_ID=$FASTLANE_APPLE_ID" >> $GITHUB_ENV
          echo "FASTLANE_TEAM_ID=$FASTLANE_TEAM_ID" >> $GITHUB_ENV
          echo "FASTLANE_ITC_TEAM_ID=$FASTLANE_ITC_TEAM_ID" >> $GITHUB_ENV
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "ASC_PRIVATE_KEY=$ASC_PRIVATE_KEY" >> $GITHUB_ENV
          echo "MATCH_GIT_URL=$MATCH_GIT_URL" >> $GITHUB_ENV
          echo "BETA_FEEDBACK_EMAIL=$BETA_FEEDBACK_EMAIL" >> $GITHUB_ENV

      - name: Build and distribute iOS app
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'DEVELOPMENT' }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
        run: |
          cd packages/mobile/ios
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_NOTES="${{ github.event.inputs.release_notes || format('Build from {0} - {1}', github.ref_name, github.sha) }}"
          else
            RELEASE_NOTES="Build from ${{ github.ref_name }} - ${{ github.sha }}"
          fi
          
          # Export release notes for Fastlane
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV
          
          # Run Fastlane pipeline
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Production: Upload to TestFlight (can be changed to release for App Store)
            fastlane beta
          else
            # Development: Just build and test
            fastlane test_and_build
          fi

      - name: Clean up service account key
        if: always()
        run: rm -f packages/mobile/ios/service-account-key.json