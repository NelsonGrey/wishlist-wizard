# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: iOS App Distribution

# iOS builds using self-hosted macOS runner
# Automatic builds are enabled for all environments

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to distribute'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
      release_notes:
        description: 'Release notes for this build'
        required: false
        type: string

jobs:
  distribute-ios:
    runs-on: [self-hosted, macos-latest, wishlist-wizard]  # Self-hosted macOS runner
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
    steps:
      - name: iOS Build Environment Check
        run: |
          echo "🍎 Running on self-hosted macOS runner"
          echo "📍 Hostname: $(hostname)"
          echo "💰 Using self-hosted runner (cost savings)"
          echo "🖥️  macOS version: $(sw_vers -productVersion)"
          echo "🛠️  Xcode version: $(xcodebuild -version | head -1)"

      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install Fastlane
        run: gem install fastlane -v 2.228.0

      - name: Generate iOS platform files
        run: |
          cd packages/mobile
          flutter create --platforms=ios --org=com.nelsongrey.wishlistwizard.mobile .

      - name: Create service account key file
        env:
          IOS_SERVICE_ACCOUNT_KEY: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_KEY_{0}', github.ref == 'refs/heads/main' && 'PROD' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEV')] }}
        run: |
          mkdir -p packages/mobile/ios
          echo "$IOS_SERVICE_ACCOUNT_KEY" > packages/mobile/ios/service-account-key.json

      - name: Set up Fastlane environment
        run: |
          cd packages/mobile/ios
          # Create Fastlane environment file
          cat > .env << EOF
          FASTLANE_APPLE_ID=${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID=${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID=${{ secrets.FASTLANE_ITC_TEAM_ID }}
          ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY=${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL=${{ secrets.MATCH_GIT_URL }}
          BETA_FEEDBACK_EMAIL=${{ secrets.BETA_FEEDBACK_EMAIL }}
          MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME=${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD=${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_GIT_BRANCH=${{ github.ref == 'refs/heads/main' && 'main' || github.ref == 'refs/heads/staging' && 'staging' || 'develop' }}
          EOF

          # Export the .env variables into the GitHub Actions environment
          # so they are available in subsequent workflow steps (including fastlane).
          # We purposely avoid printing values here to keep secrets masked.
          if [ -f .env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              # skip empty lines
              if [ -z "$line" ]; then
                continue
              fi
              echo "$line" >> $GITHUB_ENV
            done < .env
          fi

      - name: Debug Fastlane secrets (masked)
        run: |
          cd packages/mobile/ios
          # Load env file into current shell session if present
          if [ -f .env ]; then
            # shellcheck disable=SC1091
            source .env || true
          fi

          # Masked diagnostics: do not print secrets in full
          if [ -n "${MATCH_GIT_URL:-}" ]; then
            echo "MATCH_GIT_URL=${MATCH_GIT_URL:0:40}... (masked)"
          else
            echo "MATCH_GIT_URL is empty"
          fi

          if [ -n "${MATCH_PASSWORD:-}" ]; then
            echo "MATCH_PASSWORD length=${#MATCH_PASSWORD}"
          else
            echo "MATCH_PASSWORD is empty"
          fi
        shell: bash

      - name: Set MATCH_GIT_BRANCH dynamically
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "MATCH_GIT_BRANCH=main" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
            echo "MATCH_GIT_BRANCH=staging" >> $GITHUB_ENV
          else
            echo "MATCH_GIT_BRANCH=develop" >> $GITHUB_ENV
          fi

      - name: Build and distribute iOS app
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || github.ref == 'refs/heads/staging' && 'STAGING' || 'DEVELOPMENT' }}
        run: |
          # Create a fresh temporary keychain for this CI job and export its name/password
          # into the environment for Fastlane/match to use. This avoids reusing an existing
          # keychain whose password may not match the secret in the runner.
          # If you explicitly want to reuse a named keychain, set MATCH_KEYCHAIN_REUSE=true
          MATCH_KEYCHAIN_REUSE=${MATCH_KEYCHAIN_REUSE:-false}

          if [[ "$MATCH_KEYCHAIN_REUSE" == "true" && -n "${MATCH_KEYCHAIN_NAME:-}" && -n "${MATCH_KEYCHAIN_PASSWORD:-}" ]]; then
            echo "Reusing provided MATCH keychain name (MATCH_KEYCHAIN_REUSE=true)"
            echo "MATCH_KEYCHAIN_NAME=${MATCH_KEYCHAIN_NAME}" >> $GITHUB_ENV
            echo "MATCH_KEYCHAIN_PASSWORD=${MATCH_KEYCHAIN_PASSWORD}" >> $GITHUB_ENV
          else
            # Generate a unique keychain name and password for this run
            GENERATED_KEYCHAIN_NAME="fastlane_tmp_$(date +%s)_$RANDOM"
            GENERATED_KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

            echo "Generated keychain: ${GENERATED_KEYCHAIN_NAME}"
            echo "MATCH_KEYCHAIN_NAME=${GENERATED_KEYCHAIN_NAME}" >> $GITHUB_ENV
            echo "MATCH_KEYCHAIN_PASSWORD=${GENERATED_KEYCHAIN_PASSWORD}" >> $GITHUB_ENV

            # Use the setup script for keychain creation
            bash scripts/setup_keychain.sh
          fi

          cd packages/mobile/ios
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_NOTES="${{ github.event.inputs.release_notes || format('Build from {0} - {1}', github.ref_name, github.sha) }}"
          else
            RELEASE_NOTES="Build from ${{ github.ref_name }} - ${{ github.sha }}"
          fi
          
          # Export release notes for Fastlane
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV
          
          # Run Fastlane pipeline based on environment and build type
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/staging" ]] || [[ "$BUILD_TYPE" == "release" ]]; then
            # Production/Staging OR manual release: Upload to TestFlight
            fastlane beta
          else
            # Development: Just build and test
            fastlane test_and_build
          fi

      - name: Clean up service account key
        if: always()
        run: rm -f packages/mobile/ios/service-account-key.json packages/mobile/ios/.env

      - name: Remove temporary keychain (if created)
        if: always()
        run: |
          # Only delete the keychain if we created one for this run. If MATCH_KEYCHAIN_REUSE=true
          # then the workflow intentionally reused an existing keychain and will not delete it.
          if [[ "${MATCH_KEYCHAIN_REUSE:-false}" != "true" && -n "${MATCH_KEYCHAIN_NAME:-}" ]]; then
            echo "Deleting temporary keychain ${MATCH_KEYCHAIN_NAME}"
            security delete-keychain "${MATCH_KEYCHAIN_NAME}" || true
          else
            echo "Skipping keychain deletion (reuse enabled or no keychain name set)"
          fi