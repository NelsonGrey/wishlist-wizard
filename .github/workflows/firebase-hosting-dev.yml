name: "Deploy Web App to Dev (Hosting)"

# Triggered on every push to develop — deploys the web app to the
# wishlist-wizard-dev Firebase Hosting project for review and testing.
# Business logic lives in Firebase Functions (private, server-side).
# This workflow publishes only the compiled dist/ bundle; no source is exposed.
#
# Auth: Workload Identity Federation, not the deprecated `firebase deploy
# --token` flow (Google stopped honouring `firebase login:ci` tokens — a
# refreshed token fails the same "credentials are no longer valid" way).
# Mirrors the hosting-deploy steps in firebase-deploy-local.yml, which is
# what deploys staging/main hosting; master-pipeline.yml only runs on push
# to staging/main, so develop still needs this standalone workflow.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - develop

concurrency:
  group: firebase-hosting-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-hosting-dev:
    name: Build and Deploy to Firebase Hosting (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: DEVELOPMENT

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1055615167809/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-deploy@wishlist-wizard-dev.iam.gserviceaccount.com
          token_format: access_token

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps 2>/dev/null || npm ci --force
          npm run build --workspace=@wishlist-wizard/shared
          npm run build --workspace=@shared/firebase-utils

      # Fetch the real Firebase Web SDK config live from the Management API
      # instead of storing VITE_FIREBASE_*_DEVELOPMENT secrets here — same
      # approach as firebase-deploy-local.yml. These values are safe to
      # expose client-side by design, so fetching them fresh avoids drift.
      - name: Fetch Firebase Web App Config
        id: webconfig
        run: |
          set -euo pipefail
          PROJECT_ID="wishlist-wizard-dev"
          TOKEN="${{ steps.auth.outputs.access_token }}"

          APP_ID="$(curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const o=JSON.parse(d);process.stdout.write((o.apps&&o.apps[0]&&o.apps[0].appId)||"");})')"

          if [ -z "$APP_ID" ]; then
            echo "::error::No web app registered for Firebase project $PROJECT_ID"
            exit 1
          fi

          curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps/$APP_ID/config" \
            | node -e '
                let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                  const c = JSON.parse(d);
                  const fs = require("fs");
                  const lines = [
                    `api_key=${c.apiKey||""}`,
                    `auth_domain=${c.authDomain||""}`,
                    `project_id=${c.projectId||""}`,
                    `storage_bucket=${c.storageBucket||""}`,
                    `messaging_sender_id=${c.messagingSenderId||""}`,
                    `app_id=${c.appId||""}`,
                    `measurement_id=${c.measurementId||""}`,
                  ];
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
                });
              '

      - name: Build Web App
        env:
          VITE_ENVIRONMENT: development
          VITE_FIREBASE_API_KEY_DEVELOPMENT: ${{ steps.webconfig.outputs.api_key }}
          VITE_FIREBASE_AUTH_DOMAIN_DEVELOPMENT: ${{ steps.webconfig.outputs.auth_domain }}
          VITE_FIREBASE_PROJECT_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.project_id }}
          VITE_FIREBASE_STORAGE_BUCKET_DEVELOPMENT: ${{ steps.webconfig.outputs.storage_bucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.messaging_sender_id }}
          VITE_FIREBASE_APP_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.app_id }}
          VITE_FIREBASE_MEASUREMENT_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.measurement_id }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_DEVELOPMENT }}
          VITE_NON_PROD_SITE_PASSWORD: ${{ secrets.NON_PROD_SITE_PASSWORD_DEVELOPMENT }}
        run: npm run build --workspace=@wishlist-wizard/web

      - name: Use Dev Firebase Config
        run: cp firebase.dev.json firebase.json

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --project="wishlist-wizard-dev" \
            --only=hosting \
            --message="Dev hosting deploy from develop — ${{ github.sha }}" \
            --non-interactive
