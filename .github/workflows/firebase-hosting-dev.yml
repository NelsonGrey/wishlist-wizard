name: "Deploy to Dev (Functions + Rules + Hosting)"

# Triggered on every push to develop — deploys the full app to the
# wishlist-wizard-dev project: Firebase Functions (from the private
# companion repo NelsonGrey/wishlist-wizard-functions @ develop), Firestore
# rules + indexes, and the web Hosting bundle — plus builds & tests the
# browser extension.
#
# Previously develop got Hosting only (master-pipeline.yml deliberately
# excluded develop from Functions deploys), so the wishlist-wizard and
# wishlist-wizard-functions develop branches were perpetually out of sync on
# dev. Now develop deploys both, through the SAME reusable workflow
# (firebase-deploy-local.yml) that staging and main use — so dev is a real
# rehearsal of the staging/main deploy, with no separate implementation to
# drift.
#
# Auth: Workload Identity Federation, not the deprecated `firebase deploy
# --token` flow.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - develop

concurrency:
  group: firebase-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Functions + Firestore rules/indexes + Hosting → wishlist-wizard-dev.
  deploy-dev:
    name: Deploy to Dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/firebase-deploy-local.yml
    with:
      project_name: wishlist-wizard
      environment: development
      deploy_rules: true
    secrets:
      firebase_project_dev: ${{ secrets.FIREBASE_PROJECT_DEV }}
      firebase_project_staging: ${{ secrets.FIREBASE_PROJECT_STAGING }}
      firebase_project_prod: ${{ secrets.FIREBASE_PROJECT_PRODUCTION }}
      functions_repo_pat: ${{ secrets.FUNCTIONS_REPO_PAT }}
      stripe_publishable_key_development: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_DEVELOPMENT }}
      stripe_publishable_key_staging: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_STAGING }}
      stripe_publishable_key_production: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_PRODUCTION }}
      # dev has no EnvironmentPasswordGate (only staging is in
      # PROTECTED_ENVIRONMENTS), so no NON_PROD_SITE_PASSWORD_DEVELOPMENT is
      # passed — the reusable workflow defaults it to empty.
      non_prod_site_password_staging: ${{ secrets.NON_PROD_SITE_PASSWORD_STAGING }}

  # Build + unit + e2e (extension loaded in a real browser) on every develop
  # push, with the dev Firebase config baked in. Previously the extension
  # only got CI via master-pipeline.yml (staging/main). Does not publish.
  extension:
    name: Build & Test Browser Extension (dev)
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/extension-build.yml
    with:
      project_name: wishlist-wizard
      environment: development
      publish: false
