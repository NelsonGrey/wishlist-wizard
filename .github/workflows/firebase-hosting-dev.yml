name: "Deploy to Dev (Functions + Rules + Hosting)"

# Triggered on every push to develop — deploys the full app (Firebase
# Functions from the private companion repo, Firestore rules/indexes, and
# the web Hosting bundle) to the wishlist-wizard-dev project.
#
# Previously this workflow deployed Hosting ONLY, and master-pipeline.yml
# deliberately excluded develop from its Functions deploy. That left the two
# repos out of sync on dev: a develop push to wishlist-wizard shipped the
# web app, but the matching wishlist-wizard-functions develop commit never
# reached any running environment until a staging/main promotion. The split
# into a private repo was for IP protection, not to give that code a
# second-class deploy path — so develop now deploys both, using the exact
# same reusable workflow (firebase-deploy-local.yml) that staging and main
# use, which checks out the functions repo at its own `develop` HEAD.
#
# Auth is Workload Identity Federation (handled inside the reusable
# workflow), not the deprecated `firebase deploy --token` flow.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - develop

concurrency:
  group: firebase-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy Functions + Rules + Hosting to Dev
    uses: ./.github/workflows/firebase-deploy-local.yml
    with:
      project_name: wishlist-wizard
      environment: development
      # Also push firestore.rules / firestore.indexes.json — the Functions
      # change frequently comes with a matching rules change (e.g. a new
      # collection's access policy), and staging/main already deploy rules
      # here via the same input.
      deploy_rules: true
    secrets:
      firebase_project_dev: ${{ secrets.FIREBASE_PROJECT_DEV }}
      firebase_project_staging: ${{ secrets.FIREBASE_PROJECT_STAGING }}
      firebase_project_prod: ${{ secrets.FIREBASE_PROJECT_PRODUCTION }}
      functions_repo_pat: ${{ secrets.FUNCTIONS_REPO_PAT }}
      stripe_publishable_key_development: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_DEVELOPMENT }}
      stripe_publishable_key_staging: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_STAGING }}
      stripe_publishable_key_production: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_PRODUCTION }}
      # dev has no EnvironmentPasswordGate (only staging is in
      # PROTECTED_ENVIRONMENTS), so no NON_PROD_SITE_PASSWORD_DEVELOPMENT is
      # passed — the reusable workflow defaults it to empty.
      non_prod_site_password_staging: ${{ secrets.NON_PROD_SITE_PASSWORD_STAGING }}
