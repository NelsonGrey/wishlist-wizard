name: "Deploy to Dev (Functions + Rules + Hosting)"

# Triggered on every push to develop — deploys the full app to the
# wishlist-wizard-dev project: Firebase Functions (from the private
# companion repo NelsonGrey/wishlist-wizard-functions @ develop), Firestore
# rules + indexes, and the web Hosting bundle.
#
# Previously this workflow deployed Hosting ONLY, and master-pipeline.yml
# deliberately excluded develop from its Functions deploy. That left the two
# repos out of sync on dev: a develop push to wishlist-wizard shipped the
# web app, but the matching wishlist-wizard-functions develop commit never
# reached any running environment until a staging/main promotion. The split
# into a private repo was for IP protection, not to give that code a
# second-class deploy path.
#
# This does NOT reuse firebase-deploy-local.yml: that workflow checks the
# functions repo out into packages/functions (a monorepo workspace) and then
# runs `npm ci` at the monorepo root, which fails EUSAGE because the root
# lockfile — generated without the gitignored packages/functions present —
# can't be in sync with the functions repo's own dependencies. Instead this
# job does every root npm operation BEFORE the functions checkout, then
# builds the functions repo against its own (in-sync) lockfile.
#
# Auth: Workload Identity Federation, not the deprecated `firebase deploy
# --token` flow.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - develop

concurrency:
  group: firebase-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + unit + e2e (extension loaded in a real browser) on every develop
  # push, with the dev Firebase config baked in. Previously the extension
  # only got CI via master-pipeline.yml (staging/main) — the same develop gap
  # the Functions deploy had. Does not publish to any store.
  extension:
    name: Build & Test Browser Extension (dev)
    uses: ./.github/workflows/extension-build.yml
    with:
      project_name: wishlist-wizard
      environment: development
      publish: false

  deploy-dev:
    name: Deploy Functions + Rules + Hosting to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: DEVELOPMENT

    env:
      FIREBASE_PROJECT: wishlist-wizard-dev

    steps:
      - name: Checkout wishlist-wizard
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1055615167809/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-deploy@wishlist-wizard-dev.iam.gserviceaccount.com
          token_format: access_token

      # ── All monorepo-root npm work happens here, BEFORE packages/functions
      #    exists — otherwise root `npm ci` sees an unknown workspace and fails.
      - name: Install root dependencies + build shared packages
        run: |
          npm ci --legacy-peer-deps 2>/dev/null || npm ci --force
          npm run build --workspace=@wishlist-wizard/shared
          npm run build --workspace=@shared/firebase-utils

      # Fetch the real Firebase Web SDK config live from the Management API
      # (these values are safe to expose client-side by design — fetching
      # fresh avoids VITE_FIREBASE_*_DEVELOPMENT secret drift).
      - name: Fetch Firebase Web App Config
        id: webconfig
        run: |
          set -euo pipefail
          PROJECT_ID="$FIREBASE_PROJECT"
          TOKEN="${{ steps.auth.outputs.access_token }}"

          APP_ID="$(curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const o=JSON.parse(d);process.stdout.write((o.apps&&o.apps[0]&&o.apps[0].appId)||"");})')"

          if [ -z "$APP_ID" ]; then
            echo "::error::No web app registered for Firebase project $PROJECT_ID"
            exit 1
          fi

          curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps/$APP_ID/config" \
            | node -e '
                let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                  const c = JSON.parse(d);
                  const fs = require("fs");
                  const lines = [
                    `api_key=${c.apiKey||""}`,
                    `auth_domain=${c.authDomain||""}`,
                    `project_id=${c.projectId||""}`,
                    `storage_bucket=${c.storageBucket||""}`,
                    `messaging_sender_id=${c.messagingSenderId||""}`,
                    `app_id=${c.appId||""}`,
                    `measurement_id=${c.measurementId||""}`,
                  ];
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
                });
              '

      - name: Build Web App
        env:
          VITE_ENVIRONMENT: development
          VITE_FIREBASE_API_KEY_DEVELOPMENT: ${{ steps.webconfig.outputs.api_key }}
          VITE_FIREBASE_AUTH_DOMAIN_DEVELOPMENT: ${{ steps.webconfig.outputs.auth_domain }}
          VITE_FIREBASE_PROJECT_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.project_id }}
          VITE_FIREBASE_STORAGE_BUCKET_DEVELOPMENT: ${{ steps.webconfig.outputs.storage_bucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.messaging_sender_id }}
          VITE_FIREBASE_APP_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.app_id }}
          VITE_FIREBASE_MEASUREMENT_ID_DEVELOPMENT: ${{ steps.webconfig.outputs.measurement_id }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_DEVELOPMENT }}
        run: npm run build --workspace=@wishlist-wizard/web

      # ── Bring in the private functions repo at its develop HEAD.
      #    Checked out to functions_src (a top-level dir that does NOT match
      #    the root package.json's "packages/*" workspace glob) so `npm ci`
      #    resolves against the functions repo's own in-sync lockfile instead
      #    of being hijacked into the monorepo workspace and validated against
      #    the root lock (which can't know these deps — packages/functions is
      #    gitignored here). It's rsync'd into packages/functions afterwards
      #    for `firebase deploy` (firebase.json's "source": "packages/functions").
      - name: Checkout Functions (private companion repo)
        uses: actions/checkout@v5
        with:
          repository: NelsonGrey/wishlist-wizard-functions
          token: ${{ secrets.FUNCTIONS_REPO_PAT }}
          ref: develop
          path: functions_src

      - name: Build Functions
        env:
          npm_config_workspaces: "false"
          WW_SHARED_DIST: ${{ github.workspace }}/packages/shared/dist
        # prebuild runs scripts/vendor-shared.js, which copies the built
        # shared dist (WW_SHARED_DIST) into the vendored package.
        run: |
          cd functions_src
          npm ci
          npm run build
          cd ..
          mkdir -p packages/functions
          rsync -a --delete functions_src/ packages/functions/

      - name: Use Dev Firebase Config
        run: cp firebase.dev.json firebase.json

      - name: Deploy Functions + Firestore rules & indexes
        run: |
          firebase deploy \
            --project="$FIREBASE_PROJECT" \
            --only=functions,firestore:rules,firestore:indexes \
            --message="Dev deploy from develop — ${{ github.sha }}" \
            --force \
            --non-interactive

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --project="$FIREBASE_PROJECT" \
            --only=hosting \
            --message="Dev hosting deploy from develop — ${{ github.sha }}" \
            --non-interactive
