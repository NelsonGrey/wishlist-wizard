name: Icon Update

on:
  workflow_dispatch:

jobs:
  generate-icons:
    # Use the project macOS runner to allow sips
    runs-on: [self-hosted, macos-latest, wishlist-wizard]
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run icon apply script
        run: |
          set -euo pipefail
          ./scripts/apply-new-icon.sh icons/icon-wishlist-wizard.png || true

      - name: Attempt to convert PNG master to SVG (optional)
        run: |
          set -euo pipefail
          # Try to install potrace/imagemagick on macOS runners; ignore failures
          if command -v brew >/dev/null 2>&1; then
            brew install potrace imagemagick || true
          fi
          ./scripts/convert-png-to-svg.sh icons/icon-wishlist-wizard.png icons/icon-wishlist-wizard.svg || true

      - name: Check for generated changes
        id: check_changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with generated files (if any)
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(icons): auto-generate platform icons from master"
          branch: "auto/icons-update-${{ github.run_id }}"
          title: "chore(icons): auto-generate platform icons from master"
          body: "This PR was auto-generated by the icon update workflow to add resized assets across platforms. Review and merge to update icons."
          labels: automated,icons
          add-paths: "**/*"
