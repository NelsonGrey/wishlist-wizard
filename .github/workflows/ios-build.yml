name: iOS Build with Keychain Management

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    runs-on: macos-13
    timeout-minutes: 60
    
    environment:
      name: ios-${{ inputs.build_type }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
      
      - name: Install Dependencies
        run: |
          brew install cocoapods
          flutter pub get
      
      # ========= KEYCHAIN MANAGEMENT - PART 1: Initialize ==========
      
      - name: Clean Previous Keychains
        run: |
          echo "🧹 Cleaning up leftover keychains from previous runs..."
          
          # List current keychains
          echo "Current keychains (before cleanup):"
          security list-keychains -d user | head -20
          
          # Remove ephemeral keychains
          for kc in "$HOME/Library/Keychains"/*fastlane_tmp*; do
            if [ -f "$kc" ]; then
              security delete-keychain "$kc" 2>/dev/null && echo "  ✅ Deleted $kc" || true
            fi
          done
          
          echo "✅ Previous keychains cleaned"
      
      - name: Initialize Ephemeral Keychain
        run: |
          echo "🔐 Initializing ephemeral keychain for code signing..."
          
          KEYCHAIN_NAME="fastlane_tmp_keychain"
          KEYCHAIN_PASSWORD="${{ secrets.MATCH_KEYCHAIN_PASSWORD }}"
          KEYCHAIN_PATH="$HOME/Library/Keychains/${KEYCHAIN_NAME}.keychain-db"
          
          # Create new ephemeral keychain
          echo "  Creating keychain: $KEYCHAIN_NAME"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Unlock immediately
          echo "  Unlocking keychain..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Extended timeout (2 hours) to prevent re-locking during build
          echo "  Setting 2-hour timeout..."
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          
          # SET KEY PARTITION LIST - THIS IS CRITICAL
          # This allows apple tools and codesign to access keys without prompting
          echo "  Setting key partition list..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" 2>/dev/null || true
          
          # Add to keychain search list
          echo "  Adding to keychain search list..."
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          # Verify setup
          echo "✅ Keychain Status:"
          security show-keychain-info "$KEYCHAIN_PATH" 2>/dev/null || echo "  ⚠️  Unable to show keychain info"
          
          # Export for subsequent steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      
      # ========= CODE SIGNING SETUP ==========
      
      - name: Import Code Signing Certificates
        run: |
          echo "📜 Importing code signing certificates..."
          
          # Create temporary directory for P12 cert
          CERT_PATH="$(mktemp -d)/cert.p12"
          
          # Decode base64 P12 certificate
          echo "${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}" | base64 --decode > "$CERT_PATH"
          
          # Import into ephemeral keychain
          echo "  Importing certificate into $KEYCHAIN_NAME..."
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcode-select \
            2>/dev/null || true
          
          # Verify import
          echo "✅ Certificates in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          # Cleanup temporary cert file
          rm -f "$CERT_PATH"
      
      - name: Configure Fastlane Environment
        run: |
          echo "⚙️  Configuring Fastlane environment variables..."
          
          # Ensure Fastlane has keychain info
          echo "MATCH_KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          # Set code signing flags
          echo "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH" >> $GITHUB_ENV
          
          # App Store Connect API Key
          echo "APP_STORE_CONNECT_KEY_ID=${{ secrets.APP_STORE_CONNECT_KEY_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY=${{ secrets.APP_STORE_CONNECT_KEY }}" >> $GITHUB_ENV
          
          # Match repository credentials
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BRANCH=${{ secrets.MATCH_GIT_BRANCH || 'main' }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BASIC_AUTHORIZATION=${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}" >> $GITHUB_ENV
          
          echo "✅ Environment configured"
      
      # ========= PRE-BUILD VERIFICATION ==========
      
      - name: Verify Keychain Setup
        run: |
          echo "🔍 Verifying keychain setup before build..."
          
          # Check keychain exists
          if [ ! -f "$KEYCHAIN_PATH" ]; then
            echo "❌ ERROR: Keychain not found at $KEYCHAIN_PATH"
            exit 1
          fi
          echo "  ✅ Keychain file exists"
          
          # Check it's accessible
          if security show-keychain-info "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "  ✅ Keychain is accessible"
          else
            echo "  ⚠️  Keychain info not available"
          fi
          
          # Check certificates
          if security find-identity -v "$KEYCHAIN_PATH" 2>/dev/null | grep -q "Apple Distribution"; then
            echo "  ✅ Code signing certificates present"
          else
            echo "  ⚠️  No Apple Distribution certificate found"
            echo "     Available identities:"
            security find-identity -v "$KEYCHAIN_PATH" || true
          fi
          
          # Summary
          echo ""
          echo "📊 Keychain Summary:"
          echo "  Name: $KEYCHAIN_NAME"
          echo "  Path: $KEYCHAIN_PATH"
          echo "  Partition list: configured (apple-tool, apple, codesign)"
          echo "  Timeout: 2 hours"
      
      # ========= BUILD STEPS ==========
      
      - name: Run Tests (if enabled)
        if: ${{ !inputs.skip_tests }}
        run: |
          cd packages/mobile
          flutter test
          # Run mobile UAT smoke on available Apple runtime before iOS distribution build.
          DEVICE_ID=$(flutter devices --machine | node -e "const fs=require('fs');const devices=JSON.parse(fs.readFileSync(0,'utf8'));const preferred=devices.find(d=>d.targetPlatform==='ios'&&d.emulator)||devices.find(d=>d.targetPlatform==='ios');if(!preferred){console.error('No iOS simulator or iOS device found for integration_test/auth_smoke_test.dart');process.exit(1);}process.stdout.write(preferred.id);")
          flutter test integration_test/auth_smoke_test.dart -d "$DEVICE_ID"
      
      - name: Build iOS App
        env:
          MATCH_KEYCHAIN_NAME: ${{ env.KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
          MATCH_KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          OTHER_CODE_SIGN_FLAGS: "--keychain ${{ env.KEYCHAIN_PATH }}"
        run: |
          echo "🏗️  Building iOS app (${{ inputs.build_type }})..."
          
          cd packages/mobile/ios
          
          # Pre-build keychain unlock (safety measure)
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true
          
          case "${{ inputs.build_type }}" in
            testflight)
              echo "📦 Building for TestFlight..."
              fastlane build_testflight
              ;;
            appstore)
              echo "📱 Building for App Store..."
              fastlane build_appstore
              ;;
            *)
              echo "❌ Unknown build type: ${{ inputs.build_type }}"
              exit 1
              ;;
          esac
          
          echo "✅ Build completed"
      
      # ========= POST-BUILD STEPS ==========
      
      - name: Upload to TestFlight
        if: ${{ inputs.build_type == 'testflight' }}
        env:
          MATCH_KEYCHAIN_NAME: ${{ env.KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          echo "🚀 Uploading to TestFlight..."
          
          cd packages/mobile/ios
          fastlane beta
          
          echo "✅ Upload completed"
      
      # ========= CLEANUP ==========
      
      - name: Cleanup Keychains
        if: always()
        run: |
          echo "🧹 Cleaning up keychains..."
          
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "  Deleting ephemeral keychain: $KEYCHAIN_PATH"
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          
          # Restore login keychain as default
          LOGIN_KC="$HOME/Library/Keychains/login.keychain-db"
          if [ ! -f "$LOGIN_KC" ]; then
            LOGIN_KC="$HOME/Library/Keychains/login.keychain"
          fi
          if [ -f "$LOGIN_KC" ]; then
            security default-keychain -d user -s "$LOGIN_KC" 2>/dev/null || true
          fi
          
          echo "✅ Cleanup completed"
      
      - name: Report Build Status
        if: always()
        run: |
          echo "📋 Build Summary:"
          echo "  Build Type: ${{ inputs.build_type }}"
          echo "  Skip Tests: ${{ inputs.skip_tests }}"
          echo "  Status: ${{ job.status }}"
          echo "  Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
