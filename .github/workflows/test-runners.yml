name: 🧪 Test Self-Hosted Runners

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test Linux Runner
    runs-on: ubuntu-latest
    steps:
      - name: Hello from Linux
        run: |
          echo "🐧 Hello from Linux self-hosted runner!"
          uname -a
          echo "🏠 Hostname: $(hostname)"
          echo "💰 Cost savings: Using self-hosted runner"
          date

  test-macos:
    name: Test macOS Runner
    runs-on: [self-hosted, macOS]
    steps:
      - name: Hello from macOS
        run: |
          echo "🍎 Hello from macOS self-hosted runner!"
          uname -a
          echo "🏠 Hostname: $(hostname)"
          echo "💰 Cost savings: Using self-hosted runner"
          sw_vers
          date