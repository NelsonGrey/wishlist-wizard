name: "Master CI/CD Pipeline"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - build_all
          - test_all
          - build_and_deploy
          - deploy_only
          - android_deploy_only
      environment:
        description: "Environment for deployment"
        required: false
        type: choice
        options:
          - development
          - demonstration
          - staging
          - production
        default: "development"
      verbose:
        description: "Enable verbose output"
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - develop
      - staging
      - main
  # develop is deliberately excluded here even though the project manifest
  # (.cicd/projects/wishlist-wizard.yml) lists it under ci.triggers — adding
  # it would newly activate deploy-firebase (a real Functions deploy) on
  # every develop push, a bigger behavior change than "leave develop as-is".
  # develop keeps its existing dev-hosting-only deploy via
  # firebase-hosting-dev.yml.
  push:
    branches:
      - staging
      - main
    paths:
      - "packages/mobile/**"
      - "packages/web/**"
      - "packages/browser-extension/**"
      - "packages/functions/**"
      - ".github/workflows/**"
      - ".cicd/projects/**"
      - "pubspec.yaml"
      - "firebase*.json"

concurrency:
  group: master-pipeline-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_PATH: ".cicd/projects/wishlist-wizard.yml"

jobs:
  cancel-stale-runs:
    name: Cancel Stale Runs
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel queued and in-progress runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait briefly so the GitHub concurrency group can settle; this
          # reduces (but does not eliminate) the chance that two simultaneous
          # runs cancel each other before the concurrency group has a chance
          # to do so itself.
          sleep 5
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.ref_name }}" \
            --status queued \
            --json databaseId \
            --jq '.[].databaseId' | while read -r run_id; do
              # Only cancel runs older than this one on the same ref.
              if [ "$run_id" -lt "${{ github.run_id }}" ]; then
                echo "Cancelling stale queued run $run_id on ${{ github.ref_name }}"
                gh run cancel "$run_id" --repo "${{ github.repository }}" || true
              fi
            done
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.ref_name }}" \
            --status in_progress \
            --json databaseId \
            --jq '.[].databaseId' | while read -r run_id; do
              # Only cancel runs older than this one on the same ref.
              if [ "$run_id" -lt "${{ github.run_id }}" ]; then
                echo "Cancelling stale in-progress run $run_id on ${{ github.ref_name }}"
                gh run cancel "$run_id" --repo "${{ github.repository }}" || true
              fi
            done

  load-config:
    name: Load Project Configuration
    needs: cancel-stale-runs
    runs-on: ubuntu-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      FIREBASE_PROJECT_DEV: ${{ secrets.FIREBASE_PROJECT_DEVELOPMENT || 'wishlist-wizard-dev' }}
      FIREBASE_PROJECT_DEMO: ${{ secrets.FIREBASE_PROJECT_DEMONSTRATION || 'wishlist-wizard-demo' }}
      FIREBASE_PROJECT_STAGING: ${{ secrets.FIREBASE_PROJECT_STAGING || 'wishlist-wizard-staging' }}
      FIREBASE_PROJECT_PROD: ${{ secrets.FIREBASE_PROJECT_PRODUCTION || 'wishlist-wizard-prod' }}
      MATCH_GIT_BRANCH: main
    outputs:
      project_name: ${{ steps.manifest.outputs.project_name }}
      ios_enabled: ${{ steps.manifest.outputs.ios_enabled }}
      android_enabled: ${{ steps.manifest.outputs.android_enabled }}
      web_enabled: ${{ steps.manifest.outputs.web_enabled }}
      firebase_enabled: ${{ steps.manifest.outputs.firebase_enabled }}
      chrome_extension: ${{ steps.manifest.outputs.chrome_extension }}
      mobile_build: ${{ steps.manifest.outputs.mobile_build }}
      trigger_context: ${{ steps.context.outputs.trigger }}
      target_environment: ${{ steps.context.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Load Manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
        run: |
          ruby <<'RUBY'
          require 'yaml'

          manifest_path = ENV.fetch('MANIFEST_PATH')
          unless File.exist?(manifest_path)
            warn "Project manifest not found at #{manifest_path}"
            exit 1
          end

          data = YAML.safe_load(File.read(manifest_path)) || {}
          targets = data.fetch('targets', {}) || {}

          outputs = {
            project_name: data.dig('project', 'name') || File.basename(Dir.pwd),
            ios_enabled: targets.dig('ios', 'enabled') ? 'true' : 'false',
            android_enabled: targets.dig('android', 'enabled') ? 'true' : 'false',
            web_enabled: targets.dig('web', 'enabled') ? 'true' : 'false',
            firebase_enabled: targets.dig('firebase', 'enabled') ? 'true' : 'false',
            chrome_extension: targets.dig('chrome_extension', 'enabled') ? 'true' : 'false'
          }

          outputs[:mobile_build] = (outputs[:ios_enabled] == 'true' || outputs[:android_enabled] == 'true') ? 'true' : 'false'

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |f|
            outputs.each { |key, value| f.puts("#{key}=#{value}") }
          end

          puts "Manifest loaded for #{outputs[:project_name]}"
          RUBY

      - name: Determine Trigger Context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="${{ github.event.inputs.action }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TRIGGER="build_and_deploy"
            ENVIRONMENT="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            TRIGGER="build_and_deploy"
            ENVIRONMENT="staging"
          elif [ "${{ github.ref }}" = "refs/heads/demonstration" ]; then
            TRIGGER="build_and_deploy"
            ENVIRONMENT="demonstration"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TRIGGER="build_and_deploy"
            ENVIRONMENT="development"
          else
            TRIGGER="test_all"
            ENVIRONMENT="development"
          fi

          echo "trigger=$TRIGGER" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

  test:
    name: Run Tests
    needs: load-config
    if: |
      needs.load-config.outputs.trigger_context == 'test_all' ||
      needs.load-config.outputs.trigger_context == 'build_all' ||
      needs.load-config.outputs.trigger_context == 'build_and_deploy'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # packages/functions moved to a separate private repo (business logic
      # shouldn't be world-readable on this public repo). It lands at the
      # exact path it used to occupy, so vendor-shared.js's relative path to
      # packages/shared/dist and firebase*.json's "source": "packages/functions"
      # both keep working unchanged.
      - name: Checkout Functions (private companion repo)
        uses: actions/checkout@v7
        with:
          repository: NelsonGrey/wishlist-wizard-functions
          token: ${{ secrets.FUNCTIONS_REPO_PAT }}
          ref: ${{ needs.load-config.outputs.target_environment == 'production' && 'main' || needs.load-config.outputs.target_environment == 'staging' && 'staging' || 'develop' }}
          path: packages/functions

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        if: ${{ hashFiles('packages/mobile/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Quality Gates
        run: |
          set -euo pipefail

          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found at repo root"
            exit 1
          fi

          if ! command -v npm &> /dev/null; then
            echo "❌ npm not found on runner"
            exit 1
          fi

          npm ci
          npm run lint
          npm run check
          npm run test --workspaces --if-present
          npm run requirements:verify

          if [ -f "artifacts/requirements-verification-report.json" ]; then
            BLOCKING=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String((p.summary&&typeof p.summary.blockingFailures==='number')?p.summary.blockingFailures:NaN));" artifacts/requirements-verification-report.json)
            UNMAPPED=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String((p.summary&&typeof p.summary.unmappedCompleted==='number')?p.summary.unmappedCompleted:NaN));" artifacts/requirements-verification-report.json)
            {
              echo "### Requirements Verification"
              echo "- Blocking failures: $BLOCKING"
              echo "- Unmapped completed requirements: $UNMAPPED"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "packages/mobile/pubspec.yaml" ]; then
            if ! command -v flutter &> /dev/null; then
              echo "❌ Flutter is required for mobile tests but was not found on runner"
              exit 1
            fi

            pushd packages/mobile
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            popd
          fi

          SKIP_ANDROID_RELEASE_ARTIFACT_CHECK=true SKIP_IOS_RELEASE_ARTIFACT_CHECK=true npm run go-live:check | tee /tmp/go-live-check.log
          {
            echo "### Go-Live Check"
            echo '```text'
            cat /tmp/go-live-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web-uat-tests:
    name: Web UAT (${{ matrix.browser }})
    needs: [load-config, test]
    # TEMPORARY: skipped on pull_request while the live dev-environment UAT
    # failures (timeouts on T1-4 Create Wishlist, all 3 browsers) are
    # investigated separately. push/workflow_dispatch behavior unchanged.
    if: |
      github.event_name != 'pull_request' &&
      needs.load-config.outputs.web_enabled == 'true' &&
      (needs.load-config.outputs.trigger_context == 'test_all' ||
       needs.load-config.outputs.trigger_context == 'build_all' ||
       needs.load-config.outputs.trigger_context == 'build_and_deploy')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps 2>/dev/null || npm ci --force

      - name: Install Playwright Browsers
        run: |
          # Install only the target browser to reduce download surface area.
          # Retry to tolerate transient CDN/network failures on hosted runners.
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3 for browser '${{ matrix.browser }}'"
            if npx playwright install --with-deps "${{ matrix.browser }}"; then
              echo "Playwright browser install succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Install failed, retrying..."
            fi
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1

      - name: Run Web UAT (${{ matrix.browser }})
        env:
          TARGET_ENV: ${{ needs.load-config.outputs.target_environment }}
        run: |
          case "$TARGET_ENV" in
            production)
              export TEST_URL="https://wishlist-wizard-prod.web.app"
              ;;
            staging)
              export TEST_URL="https://wishlist-wizard-staging.web.app"
              ;;
            demonstration)
              export TEST_URL="https://wishlist-wizard-demo.web.app"
              ;;
            *)
              export TEST_URL="https://wishlist-wizard-dev.web.app"
              ;;
          esac
          echo "Running Web UAT against TEST_URL=$TEST_URL"
          npm run test:e2e:tier1 -- --project=${{ matrix.browser }}

      - name: Upload UAT Artifacts (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-uat-${{ matrix.browser }}-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    needs: [load-config, test, web-uat-tests]
    if: |
      always() &&
      (needs.load-config.outputs.trigger_context == 'test_all' ||
       needs.load-config.outputs.trigger_context == 'build_all' ||
       needs.load-config.outputs.trigger_context == 'build_and_deploy' ||
       needs.load-config.outputs.trigger_context == 'android_deploy_only')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate test and UAT gates
        run: |
          echo "test=${{ needs.test.result }}"
          echo "web-uat-tests=${{ needs.web-uat-tests.result }}"

          if [ "${{ needs.load-config.outputs.trigger_context }}" = "android_deploy_only" ]; then
            echo "android_deploy_only: skipping the full test/UAT gate (Android-only debug verification path)"
            exit 0
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test suite did not pass"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.web-uat-tests.result }}" = "skipped" ]; then
            echo "Web UAT skipped on pull_request (temporarily disabled — see web-uat-tests job comment)"
          elif [ "${{ needs.web-uat-tests.result }}" != "success" ]; then
            echo "::error::Web UAT matrix did not pass"
            exit 1
          fi

          echo "All quality gates passed"

  build-ios:
    name: Build iOS App
    needs: [load-config, quality-gate]
    if: |
      needs.load-config.outputs.ios_enabled == 'true' &&
      (needs.load-config.outputs.trigger_context == 'build_all' ||
       needs.load-config.outputs.trigger_context == 'build_and_deploy') &&
      (needs.load-config.outputs.target_environment == 'staging' ||
       needs.load-config.outputs.target_environment == 'production') &&
      needs.quality-gate.result == 'success'
    uses: ./.github/workflows/ios-mobile-release.yml
    with:
      release_type: ${{ needs.load-config.outputs.trigger_context == 'build_all' && 'build_only' || 'testflight' }}
      # Both staging and main land in TestFlight (not App Store submission —
      # that stays a deliberate, manual workflow_dispatch with
      # release_type=appstore, never reachable from this automatic path) —
      # different group names just so builds from each branch are
      # distinguishable in TestFlight.
      beta_group_name: >-
        ${{ needs.load-config.outputs.target_environment == 'production' && 'Beta Testers' || 'Staging' }}
      skip_tests: false
    secrets: inherit

  build-android:
    name: Build Android App
    needs: [load-config, quality-gate]
    if: |
      always() &&
      needs.load-config.outputs.android_enabled == 'true' &&
      (needs.load-config.outputs.trigger_context == 'build_all' ||
       needs.load-config.outputs.trigger_context == 'build_and_deploy' ||
       needs.load-config.outputs.trigger_context == 'android_deploy_only') &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ needs.load-config.outputs.target_environment }}
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'packages/mobile/android/**/build.gradle.kts', 'packages/mobile/android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Select Firebase Environment Config
        run: |
          # firebase_options.dart's String.fromEnvironment('FIREBASE_ENV')
          # defaults to dev, but android/app/google-services.json (the file
          # the google-services Gradle plugin actually bakes into the build)
          # is a separate, native-layer config with its own default — swap it
          # explicitly so both layers agree on which Firebase project this
          # build talks to.
          case "$TARGET_ENV" in
            production) SUFFIX=prod ;;
            staging)    SUFFIX=staging ;;
            *)          SUFFIX=dev ;;
          esac
          cp "android/app/google-services.$SUFFIX.json" android/app/google-services.json

      - name: Build Debug APK
        if: needs.load-config.outputs.trigger_context != 'build_and_deploy' && needs.load-config.outputs.trigger_context != 'android_deploy_only'
        run: flutter build apk --debug --dart-define=FIREBASE_ENV=${{ env.TARGET_ENV }}

      - name: Decode Release Keystore
        if: needs.load-config.outputs.trigger_context == 'build_and_deploy' || needs.load-config.outputs.trigger_context == 'android_deploy_only'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed release build"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/wishlist-wizard-key.jks

      - name: Build Release App Bundle
        if: needs.load-config.outputs.trigger_context == 'build_and_deploy' || needs.load-config.outputs.trigger_context == 'android_deploy_only'
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "❌ ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD secrets are not set"
            exit 1
          fi
          flutter build appbundle --release --dart-define=FIREBASE_ENV=${{ env.TARGET_ENV }}

      - name: Upload Android Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ (needs.load-config.outputs.trigger_context == 'build_and_deploy' || needs.load-config.outputs.trigger_context == 'android_deploy_only') && 'release' || 'debug' }}
          path: |
            packages/mobile/build/app/outputs/**/*.apk
            packages/mobile/build/app/outputs/**/*.aab
          if-no-files-found: warn

  deploy-android:
    name: Deploy Android to Play Store
    needs: [load-config, build-android]
    if: |
      always() &&
      needs.load-config.outputs.android_enabled == 'true' &&
      (needs.load-config.outputs.trigger_context == 'build_and_deploy' ||
       needs.load-config.outputs.trigger_context == 'android_deploy_only') &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.load-config.outputs.target_environment == 'production' && 'PRODUCTION' || 'STAGING' }}
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-build-release
          path: android-build/

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wishlistwizard.app.android
          releaseFiles: android-build/bundle/release/app-release.aab
          # Same static track for staging and main — the app isn't publicly
          # launched yet, so nothing auto-publishes to the production track.
          track: internal
          status: completed

  build-web:
    name: Build Web App
    needs: [load-config, quality-gate]
    if: |
      always() &&
      needs.load-config.outputs.web_enabled == 'true' &&
      (((needs.load-config.outputs.trigger_context == 'build_all' ||
         needs.load-config.outputs.trigger_context == 'build_and_deploy') &&
        needs.quality-gate.result == 'success') ||
       needs.load-config.outputs.trigger_context == 'deploy_only')
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_DEV: ${{ secrets.FIREBASE_PROJECT_DEVELOPMENT || 'wishlist-wizard-dev' }}
      FIREBASE_PROJECT_DEMO: ${{ secrets.FIREBASE_PROJECT_DEMONSTRATION || 'wishlist-wizard-demo' }}
      FIREBASE_PROJECT_STAGING: ${{ secrets.FIREBASE_PROJECT_STAGING || 'wishlist-wizard-staging' }}
      FIREBASE_PROJECT_PROD: ${{ secrets.FIREBASE_PROJECT_PRODUCTION || 'wishlist-wizard-prod' }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_API_KEY_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_API_KEY_DEVELOPMENT }}
      VITE_FIREBASE_AUTH_DOMAIN_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEVELOPMENT }}
      VITE_FIREBASE_PROJECT_ID_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEVELOPMENT }}
      VITE_FIREBASE_STORAGE_BUCKET_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEVELOPMENT }}
      VITE_FIREBASE_MESSAGING_SENDER_ID_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEVELOPMENT }}
      VITE_FIREBASE_APP_ID_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_APP_ID_DEVELOPMENT }}
      VITE_FIREBASE_MEASUREMENT_ID_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_DEVELOPMENT }}
      VITE_FIREBASE_API_KEY_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_API_KEY_DEMONSTRATION }}
      VITE_FIREBASE_AUTH_DOMAIN_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEMONSTRATION }}
      VITE_FIREBASE_PROJECT_ID_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_PROJECT_ID_DEMONSTRATION }}
      VITE_FIREBASE_STORAGE_BUCKET_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEMONSTRATION }}
      VITE_FIREBASE_MESSAGING_SENDER_ID_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEMONSTRATION }}
      VITE_FIREBASE_APP_ID_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_APP_ID_DEMONSTRATION }}
      VITE_FIREBASE_MEASUREMENT_ID_DEMONSTRATION: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_DEMONSTRATION }}
      VITE_FIREBASE_API_KEY_STAGING: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING }}
      VITE_FIREBASE_AUTH_DOMAIN_STAGING: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_STAGING }}
      VITE_FIREBASE_PROJECT_ID_STAGING: ${{ secrets.VITE_FIREBASE_PROJECT_ID_STAGING }}
      VITE_FIREBASE_STORAGE_BUCKET_STAGING: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_STAGING }}
      VITE_FIREBASE_MESSAGING_SENDER_ID_STAGING: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_STAGING }}
      VITE_FIREBASE_APP_ID_STAGING: ${{ secrets.VITE_FIREBASE_APP_ID_STAGING }}
      VITE_FIREBASE_MEASUREMENT_ID_STAGING: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_STAGING }}
      VITE_FIREBASE_API_KEY_PRODUCTION: ${{ secrets.VITE_FIREBASE_API_KEY_PRODUCTION }}
      VITE_FIREBASE_AUTH_DOMAIN_PRODUCTION: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_PRODUCTION }}
      VITE_FIREBASE_PROJECT_ID_PRODUCTION: ${{ secrets.VITE_FIREBASE_PROJECT_ID_PRODUCTION }}
      VITE_FIREBASE_STORAGE_BUCKET_PRODUCTION: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_PRODUCTION }}
      VITE_FIREBASE_MESSAGING_SENDER_ID_PRODUCTION: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_PRODUCTION }}
      VITE_FIREBASE_APP_ID_PRODUCTION: ${{ secrets.VITE_FIREBASE_APP_ID_PRODUCTION }}
      VITE_FIREBASE_MEASUREMENT_ID_PRODUCTION: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_PRODUCTION }}
      # App Check's reCAPTCHA site key isn't part of Firebase Hosting's
      # runtime auto-config (/__/firebase/init.json only covers the standard
      # FirebaseOptions fields above), so unlike those it MUST be baked in
      # correctly at build time — there's no runtime fallback for it.
      VITE_FIREBASE_APPCHECK_SITE_KEY_DEVELOPMENT: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY_DEVELOPMENT }}
      VITE_FIREBASE_APPCHECK_SITE_KEY_STAGING: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY_STAGING }}
      VITE_FIREBASE_APPCHECK_SITE_KEY_PRODUCTION: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY_PRODUCTION }}
      NON_PROD_SITE_PASSWORD_DEVELOPMENT: ${{ secrets.NON_PROD_SITE_PASSWORD_DEVELOPMENT }}
      NON_PROD_SITE_PASSWORD_DEMONSTRATION: ${{ secrets.NON_PROD_SITE_PASSWORD_DEMONSTRATION }}
      NON_PROD_SITE_PASSWORD_STAGING: ${{ secrets.NON_PROD_SITE_PASSWORD_STAGING }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # packages/functions moved to a separate private repo (business logic
      # shouldn't be world-readable on this public repo). It lands at the
      # exact path it used to occupy, so vendor-shared.js's relative path to
      # packages/shared/dist and firebase*.json's "source": "packages/functions"
      # both keep working unchanged.
      - name: Checkout Functions (private companion repo)
        uses: actions/checkout@v7
        with:
          repository: NelsonGrey/wishlist-wizard-functions
          token: ${{ secrets.FUNCTIONS_REPO_PAT }}
          ref: ${{ needs.load-config.outputs.target_environment == 'production' && 'main' || needs.load-config.outputs.target_environment == 'staging' && 'staging' || 'develop' }}
          path: packages/functions

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps 2>/dev/null || npm ci --force

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@wishlist-wizard/shared 2>/dev/null || echo "✓ @wishlist-wizard/shared (skip)"
          if [ -d "packages/firebase-utils" ]; then
            npm run build --workspace=@shared/firebase-utils
          else
            echo "✓ @shared/firebase-utils (skip)"
          fi

      - name: Resolve Firebase Project
        id: firebase_project
        run: |
          case "${{ needs.load-config.outputs.target_environment }}" in
            production)
              PROJECT_ID="$FIREBASE_PROJECT_PROD"
              CONFIG_FILE="firebase.prod.json"
              ENV_SUFFIX="PRODUCTION"
              ;;
            demonstration)
              PROJECT_ID="$FIREBASE_PROJECT_DEMO"
              CONFIG_FILE="firebase.demo.json"
              ENV_SUFFIX="DEMONSTRATION"
              ;;
            staging)
              PROJECT_ID="$FIREBASE_PROJECT_STAGING"
              CONFIG_FILE="firebase.staging.json"
              ENV_SUFFIX="STAGING"
              ;;
            development|*)
              PROJECT_ID="$FIREBASE_PROJECT_DEV"
              CONFIG_FILE="firebase.dev.json"
              ENV_SUFFIX="DEVELOPMENT"
              ;;
          esac

          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Firebase project ID not set for environment: ${{ needs.load-config.outputs.target_environment }}"
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT
          echo "env_suffix=$ENV_SUFFIX" >> $GITHUB_OUTPUT

      - name: Load Firebase Web Config for Build
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.firebase_project.outputs.project_id }}"
          INIT_JSON=""

          # Primary: use Firebase CLI apps:sdkconfig (works even before hosting is deployed)
          echo "Fetching Firebase web config via CLI for project: $PROJECT_ID..." >&2
          APP_LIST="$(firebase apps:list WEB \
            --project "$PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json 2>/dev/null)" || APP_LIST=""

          APP_ID="$(printf '%s' "$APP_LIST" | node -e \
            'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const o=JSON.parse(d);const a=o.result||[];console.log(a[0]&&a[0].appId||"");}catch(e){console.log("");}});' \
            2>/dev/null)" || APP_ID=""

          if [ -n "$APP_ID" ]; then
            CLI_OUT="$(firebase apps:sdkconfig WEB "$APP_ID" \
              --project "$PROJECT_ID" \
              --token "$FIREBASE_TOKEN" \
              --json 2>/dev/null)" || CLI_OUT=""
            INIT_JSON="$(printf '%s' "$CLI_OUT" | node -e \
              'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const o=JSON.parse(d);const cfg=(o.result||{}).sdkConfig||{};console.log(JSON.stringify(cfg));}catch(e){process.exit(1);}});' \
              2>/dev/null)" || INIT_JSON=""
          fi

          # Fallback: fetch from hosting endpoint (requires hosting to already be deployed)
          if [ -z "$INIT_JSON" ] || [ "$INIT_JSON" = '{}' ]; then
            echo "⚠️  CLI unavailable, falling back to hosting endpoint..." >&2
            INIT_URL="https://$PROJECT_ID.web.app/__/firebase/init.json"
            INIT_JSON="$(curl -sfL -m 30 "$INIT_URL" 2>/dev/null)" || INIT_JSON=""
          fi

          # Final fallback: synthesize Firebase config from environment secrets.
          # This covers branches/environments where hosting is not deployed and CLI app listing is unavailable.
          if [ -z "$INIT_JSON" ] || [ "$INIT_JSON" = '{}' ]; then
            echo "⚠️  Hosting endpoint unavailable, attempting env-secret fallback..." >&2
            TARGET_ENV="${{ needs.load-config.outputs.target_environment }}"

            resolve_env_value() {
              local base_name="$1"
              local value=""

              case "$TARGET_ENV" in
                production)
                  eval "value=\${${base_name}_PRODUCTION:-}"
                  ;;
                demonstration)
                  eval "value=\${${base_name}_DEMONSTRATION:-}"
                  if [ -z "$value" ]; then
                    eval "value=\${${base_name}_STAGING:-}"
                  fi
                  ;;
                staging)
                  eval "value=\${${base_name}_STAGING:-}"
                  ;;
                development|*)
                  eval "value=\${${base_name}_DEVELOPMENT:-}"
                  ;;
              esac

              if [ -z "$value" ]; then
                eval "value=\${${base_name}:-}"
              fi

              printf '%s' "$value"
            }

            API_KEY="$(resolve_env_value VITE_FIREBASE_API_KEY)"
            AUTH_DOMAIN="$(resolve_env_value VITE_FIREBASE_AUTH_DOMAIN)"
            PROJECT_ID_FROM_ENV="$(resolve_env_value VITE_FIREBASE_PROJECT_ID)"
            STORAGE_BUCKET="$(resolve_env_value VITE_FIREBASE_STORAGE_BUCKET)"
            MESSAGING_SENDER_ID="$(resolve_env_value VITE_FIREBASE_MESSAGING_SENDER_ID)"
            APP_ID="$(resolve_env_value VITE_FIREBASE_APP_ID)"
            MEASUREMENT_ID="$(resolve_env_value VITE_FIREBASE_MEASUREMENT_ID)"

            if [ -n "$API_KEY" ] && [ -n "$AUTH_DOMAIN" ] && [ -n "$PROJECT_ID_FROM_ENV" ] && [ -n "$APP_ID" ]; then
              INIT_JSON="$(API_KEY="$API_KEY" AUTH_DOMAIN="$AUTH_DOMAIN" PROJECT_ID="$PROJECT_ID_FROM_ENV" STORAGE_BUCKET="$STORAGE_BUCKET" MESSAGING_SENDER_ID="$MESSAGING_SENDER_ID" APP_ID="$APP_ID" MEASUREMENT_ID="$MEASUREMENT_ID" node -e '
                const cfg = {
                  apiKey: process.env.API_KEY || "",
                  authDomain: process.env.AUTH_DOMAIN || "",
                  projectId: process.env.PROJECT_ID || "",
                  storageBucket: process.env.STORAGE_BUCKET || "",
                  messagingSenderId: process.env.MESSAGING_SENDER_ID || "",
                  appId: process.env.APP_ID || "",
                  measurementId: process.env.MEASUREMENT_ID || ""
                };
                process.stdout.write(JSON.stringify(cfg));
              ')"
              echo "✓ Firebase config loaded from env secrets" >&2
            fi
          fi

          if [ -z "$INIT_JSON" ] || [ "$INIT_JSON" = '{}' ]; then
            echo "❌ Failed to load Firebase config for project $PROJECT_ID" >&2
            exit 1
          fi

          echo "✓ Firebase config loaded for $PROJECT_ID" >&2

          FIREBASE_INIT_JSON="$INIT_JSON" \
          ENV_SUFFIX="${{ steps.firebase_project.outputs.env_suffix }}" \
          VITE_ENVIRONMENT_VALUE="${{ needs.load-config.outputs.target_environment }}" \
          node <<'NODE'
          const fs = require('fs');

          const cfg = JSON.parse(process.env.FIREBASE_INIT_JSON || '{}');
          const suffix = process.env.ENV_SUFFIX;
          const environment = process.env.VITE_ENVIRONMENT_VALUE || 'development';
          const envFile = process.env.GITHUB_ENV;
          const nonProdPasswords = {
            development: process.env.NON_PROD_SITE_PASSWORD_DEVELOPMENT || 'ww-dev-preview',
            demonstration: process.env.NON_PROD_SITE_PASSWORD_DEMONSTRATION || 'ww-demo-preview',
            staging: process.env.NON_PROD_SITE_PASSWORD_STAGING || 'ww-staging-preview'
          };

          const mappings = {
            VITE_FIREBASE_API_KEY: cfg.apiKey || '',
            VITE_FIREBASE_AUTH_DOMAIN: cfg.authDomain || '',
            VITE_FIREBASE_PROJECT_ID: cfg.projectId || '',
            VITE_FIREBASE_STORAGE_BUCKET: cfg.storageBucket || '',
            VITE_FIREBASE_MESSAGING_SENDER_ID: cfg.messagingSenderId || '',
            VITE_FIREBASE_APP_ID: cfg.appId || '',
            VITE_FIREBASE_MEASUREMENT_ID: cfg.measurementId || ''
          };

          const lines = [`VITE_ENVIRONMENT=${environment}`];

          for (const [key, value] of Object.entries(mappings)) {
            lines.push(`${key}=${value}`);
            lines.push(`${key}_${suffix}=${value}`);
          }

          if (environment !== 'production') {
            lines.push(`VITE_NON_PROD_SITE_PASSWORD=${nonProdPasswords[environment] || ''}`);
          }

          fs.appendFileSync(envFile, `${lines.join('\n')}\n`);
          NODE

      - name: Build Web App
        run: npm run build

      - name: Deploy Web Stack (no Data Connect)
        if: needs.load-config.outputs.firebase_enabled != 'true' && (needs.load-config.outputs.trigger_context == 'build_and_deploy' || needs.load-config.outputs.trigger_context == 'deploy_only')
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "❌ FIREBASE_TOKEN is not set"
            exit 1
          fi

          if [ -f "${{ steps.firebase_project.outputs.config_file }}" ]; then
            cp "${{ steps.firebase_project.outputs.config_file }}" firebase.json
          fi

          firebase deploy \
            --project="${{ steps.firebase_project.outputs.project_id }}" \
            --token="$FIREBASE_TOKEN" \
            --only "firestore,functions,hosting" \
            --message="Deployment from GitHub Actions for ${{ needs.load-config.outputs.project_name }} to ${{ needs.load-config.outputs.target_environment }}" \
            --non-interactive

  deploy-firebase:
    name: Deploy Firebase
    needs: [load-config, build-web]
    if: |
      needs.load-config.outputs.firebase_enabled == 'true' &&
      (needs.load-config.outputs.trigger_context == 'build_and_deploy' ||
       needs.load-config.outputs.trigger_context == 'deploy_only')
    uses: ./.github/workflows/firebase-deploy-local.yml
    with:
      project_name: ${{ needs.load-config.outputs.project_name }}
      environment: ${{ needs.load-config.outputs.target_environment }}
      deploy_rules: true
    secrets:
      firebase_token: ${{ secrets.FIREBASE_TOKEN }}
      firebase_project_dev: ${{ secrets.FIREBASE_PROJECT_DEV }}
      firebase_project_staging: ${{ secrets.FIREBASE_PROJECT_STAGING }}
      firebase_project_prod: ${{ secrets.FIREBASE_PROJECT_PROD }}
      functions_repo_pat: ${{ secrets.FUNCTIONS_REPO_PAT }}

  validate-production:
    name: Validate Production Deployment
    needs: [load-config, build-web, deploy-firebase]
    if: |
      needs.load-config.outputs.target_environment == 'production' &&
      (needs.load-config.outputs.trigger_context == 'build_and_deploy' ||
       needs.load-config.outputs.trigger_context == 'deploy_only') &&
      (needs.build-web.result == 'success' || needs.deploy-firebase.result == 'success')
    uses: ./.github/workflows/production-validation.yml
    with:
      base_url: https://wishlist-wizard-prod.web.app
    secrets: inherit

  build-chrome-extension:
    name: Build Chrome Extension
    needs: load-config
    if: needs.load-config.outputs.chrome_extension == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/extension-build.yml
    with:
      project_name: ${{ needs.load-config.outputs.project_name }}
      # Only real deploy pushes (staging/main) attempt to publish — PR runs
      # and develop stay build-only, unchanged.
      publish: ${{ needs.load-config.outputs.trigger_context == 'build_and_deploy' }}
      node_version: "20"
    secrets:
      chrome_extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
      chrome_client_id: ${{ secrets.CHROME_CLIENT_ID }}
      chrome_client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
      chrome_refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  pipeline-summary:
    name: Pipeline Summary
    needs: [load-config, test, web-uat-tests, quality-gate, build-ios, build-android, deploy-android, build-web, deploy-firebase, validate-production, build-chrome-extension]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project**: ${{ needs.load-config.outputs.project_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ needs.load-config.outputs.trigger_context }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ needs.load-config.outputs.target_environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web UAT: ${{ needs.web-uat-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate: ${{ needs.quality-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Build: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Deploy: ${{ needs.deploy-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Firebase: ${{ needs.deploy-firebase.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Production Validation: ${{ needs.validate-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chrome Extension: ${{ needs.build-chrome-extension.result }}" >> $GITHUB_STEP_SUMMARY
