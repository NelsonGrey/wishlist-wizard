name: Secret Scan

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # v8.21.2 does not correctly apply this repo's top-level [[allowlists]]
          # (paths/regexes) in .gitleaks.toml, so every public Firebase client
          # API key across git history (~65 instances) was reported as a leak
          # on every single push. Confirmed locally that v8.29.1 applies the
          # same config correctly (66 -> 1 finding, the one pre-existing
          # historical secret already closed out — see docs/WISHLIST_WIZARD_GO_LIVE.md §1.9).
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan repository
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
