name: Scheduled Secret Rotation

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rotate (leave empty for all)'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - firebase
        - github
        - asc
      environment:
        description: 'Environment to target'
        required: false
        default: 'PRODUCTION'
        type: choice
        options:
        - PRODUCTION
        - STAGING
        - DEVELOPMENT

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'PRODUCTION' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install dependencies
        run: |
          gem install fastlane -v 2.228.0
          # Install gcloud CLI for Firebase operations
          curl https://sdk.cloud.google.com | bash
          echo "$HOME/google-cloud-sdk/bin" >> $GITHUB_PATH

      - name: Authenticate with Google Cloud
        if: github.event.inputs.service == 'firebase' || github.event.inputs.service == '' || github.event.inputs.service == 'all'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_KEY_{0}', github.event.inputs.environment || 'PRODUCTION')] }}

      - name: Authenticate with GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Rotate secrets
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'PRODUCTION' }}
          SERVICE: ${{ github.event.inputs.service || 'all' }}
        run: |
          chmod +x scripts/rotate_secrets.sh
          ./scripts/rotate_secrets.sh "$SERVICE"

      - name: Create rotation summary
        run: |
          echo "## 🔄 Secret Rotation Summary" >> rotation-summary.md
          echo "" >> rotation-summary.md
          echo "**Date:** $(date)" >> rotation-summary.md
          echo "**Service:** ${{ github.event.inputs.service || 'all' }}" >> rotation-summary.md
          echo "**Environment:** ${{ github.event.inputs.environment || 'PRODUCTION' }}" >> rotation-summary.md
          echo "**Triggered by:** ${{ github.event_name }}" >> rotation-summary.md
          echo "" >> rotation-summary.md
          echo "### Results:" >> rotation-summary.md
          echo "- Check the job logs above for detailed rotation results" >> rotation-summary.md
          echo "- Manual steps may be required for App Store Connect and GitHub tokens" >> rotation-summary.md
          echo "" >> rotation-summary.md
          echo "### Next Steps:" >> rotation-summary.md
          echo "- Verify CI/CD pipelines still work with rotated secrets" >> rotation-summary.md
          echo "- Update any external systems using old secrets" >> rotation-summary.md
          echo "- Consider revoking old keys after confirming new ones work" >> rotation-summary.md

      - name: Upload rotation summary
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-summary
          path: rotation-summary.md

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Secret rotation failed. Check the logs for details."
          echo "Manual intervention may be required for some services."