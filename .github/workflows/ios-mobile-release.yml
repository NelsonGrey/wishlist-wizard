name: iOS Mobile Release

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release_type:
        description: Release mode
        required: false
        type: string
        default: testflight
      skip_tests:
        description: Skip mobile tests
        required: false
        type: boolean
        default: false
      beta_group_name:
        description: TestFlight beta group
        required: false
        type: string
        default: Internal Testers
      runner_labels:
        description: Runner labels JSON array
        required: false
        type: string
        default: '["macos-latest"]'
    secrets:
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_KEY:
        required: false
      FASTLANE_APPLE_ID:
        required: false
      FASTLANE_TEAM_ID:
        required: false
  workflow_dispatch:
    inputs:
      release_type:
        description: Release mode
        required: true
        type: choice
        default: testflight
        options:
          - build_only
          - testflight
          - appstore
          - appstore_metadata
          - appstore_submit
      skip_tests:
        description: Skip mobile tests
        required: false
        default: false
        type: boolean
      beta_group_name:
        description: TestFlight beta group
        required: false
        default: Internal Testers
        type: string
      runner_labels:
        description: Runner labels JSON array
        required: false
        default: '["macos-latest"]'
        type: string

jobs:
  build-ios:
    name: Build iOS App
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 90
    environment:
      # ios-appstore requires manual approval (see repo environment
      # settings) — reserved for appstore_submit, the one genuinely
      # irreversible action here. appstore/appstore_metadata build or push
      # metadata and are safe to run repeatedly/automatically, so they stay
      # on the ungated ios-testflight environment rather than picking up
      # ios-appstore's approval requirement too.
      name: ${{ inputs.release_type == 'appstore_submit' && 'ios-appstore' || 'ios-testflight' }}
    defaults:
      run:
        shell: bash

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Xcode 16.4 has a provisioning-profile resolution bug with automatic
      # signing (the mode used since certificates stopped being stored in a
      # git repo via fastlane match); newer Xcode handles it correctly. Same
      # fix applied in vehicle-vitals after hitting this directly.
      - name: Select Xcode Version
        run: |
          LATEST=$(ls /Applications/ | grep -E "^Xcode_2[6-9]\.[0-9]+\.app$|^Xcode_[3-9][0-9]\.[0-9]+\.app$" | sort -t_ -k2 -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/${LATEST}"
            echo "Selected $LATEST"
          else
            echo "No Xcode 26+ found; using default $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd packages/mobile
          flutter pub get

      - name: Run mobile tests
        if: ${{ !inputs.skip_tests }}
        env:
          TEST_EMAIL: ${{ secrets.MOBILE_INTEGRATION_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.MOBILE_INTEGRATION_TEST_PASSWORD }}
        run: |
          cd packages/mobile
          flutter test

          DEVICE_ID="$(flutter devices --machine | node -e "const fs=require('fs');const devices=JSON.parse(fs.readFileSync(0,'utf8'));const preferred=devices.find(d=>d.targetPlatform==='ios'&&d.emulator)||devices.find(d=>d.targetPlatform==='ios');if(!preferred){process.exit(1);}process.stdout.write(preferred.id);")" || true
          if [ -n "${DEVICE_ID:-}" ]; then
            if [ -z "${TEST_EMAIL:-}" ] || [ -z "${TEST_PASSWORD:-}" ]; then
              echo "ℹ️ MOBILE_INTEGRATION_TEST_EMAIL/PASSWORD secrets not set; 'Home screen (logged in)' integration tests will skip themselves"
            fi
            flutter test integration_test/auth_smoke_test.dart -d "$DEVICE_ID" \
              --dart-define=FIREBASE_ENV=dev \
              --dart-define=TEST_EMAIL="${TEST_EMAIL:-}" \
              --dart-define=TEST_PASSWORD="${TEST_PASSWORD:-}"
          else
            echo "⚠️ No iOS simulator/device detected for integration smoke test; skipping smoke run"
          fi

      - name: Build or release iOS app
        run: |
          set -euo pipefail

          cd packages/mobile/ios
          case "${{ inputs.release_type }}" in
            build_only)
              bundle exec fastlane build_release
              ;;
            testflight)
              export BETA_FEEDBACK_EMAIL="${BETA_FEEDBACK_EMAIL:-mark.a.nelson@outlook.com}"
              export BETA_GROUP_NAME="${{ inputs.beta_group_name || 'Internal Testers' }}"
              bundle exec fastlane beta
              ;;
            appstore)
              bundle exec fastlane build_appstore
              ;;
            appstore_metadata)
              # Metadata/screenshots only via the API — no build, no signing,
              # and never submits for review.
              bundle exec fastlane push_appstore_metadata
              ;;
            appstore_submit)
              # Submits the current App Store version for human review.
              # Irreversible on Apple's side once accepted — only reachable
              # via an explicit workflow_dispatch choice, never automatically.
              bundle exec fastlane submit_appstore_for_review
              ;;
            *)
              echo "❌ Unknown release type: ${{ inputs.release_type }}"
              exit 1
              ;;
          esac

      - name: Upload iOS build artifact
        if: ${{ inputs.release_type != 'testflight' && inputs.release_type != 'appstore_metadata' && inputs.release_type != 'appstore_submit' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ inputs.release_type }}
          path: |
            build/ios/ipa/
            packages/mobile/build/ios/iphoneos/
          if-no-files-found: warn

      - name: Cleanup temporary auth files
        if: always()
        run: |
          rm -rf "$HOME/.private_keys" || true
          rm -f "$HOME/.ssh/match_repo_key" || true
