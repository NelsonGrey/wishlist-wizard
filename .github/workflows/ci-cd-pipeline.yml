name: 🚀 CI/CD Pipeline - Build, Test & Deploy All Deliverables

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  FLUTTER_VERSION: '3.35.5'

jobs:
  # 🔍 Code Quality & Testing
  quality-check:
    name: 🔍 Quality Check & Tests
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check-deploy.outputs.should-deploy }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔧 TypeScript Check
        run: npm run check --workspaces --if-present

      - name: 🧪 Run Tests
        run: npm run test --workspaces --if-present

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high

      - name: 📊 Check Deploy Condition
        id: check-deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # 🏗️ Build All Packages
  build-packages:
    name: 🏗️ Build All Packages
    runs-on: ubuntu-latest
    needs: quality-check
    strategy:
      matrix:
        package: ['web-app', 'api-server', 'browser-extension', 'shared']
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build ${{ matrix.package }}
        run: npm run build --workspace=packages/${{ matrix.package }}

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-build
          path: packages/${{ matrix.package }}/dist/
          retention-days: 7

  # 📱 Build Flutter Mobile App
  build-mobile:
    name: 📱 Build Flutter Mobile App
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 📦 Install Flutter Dependencies
        run: |
          cd packages/mobile-app
          flutter pub get

      - name: 🧪 Run Flutter Tests
        run: |
          cd packages/mobile-app
          flutter test

      - name: 🏗️ Build Flutter Web
        run: |
          cd packages/mobile-app
          flutter build web --release

      - name: 📤 Upload Mobile Build
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-build
          path: packages/mobile-app/build/web/
          retention-days: 7

  # 📦 Create Chrome Extension Package
  package-extension:
    name: 📦 Package Chrome Extension
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Extension Build
        uses: actions/download-artifact@v4
        with:
          name: browser-extension-build
          path: packages/browser-extension/dist/

      - name: 📦 Create Extension Package
        run: |
          mkdir -p chrome-extension-package
          cp -r packages/browser-extension/dist/* chrome-extension-package/
          cp packages/browser-extension/manifest.json chrome-extension-package/
          cp -r packages/browser-extension/public/icons chrome-extension-package/
          cd chrome-extension-package
          zip -r ../wishlist-wizard-extension.zip .

      - name: 📤 Upload Extension Package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: wishlist-wizard-extension.zip
          retention-days: 30

  # 🚀 Deploy Web App to Vercel
  deploy-web-app:
    name: 🌐 Deploy Web App to Vercel
    runs-on: ubuntu-latest
    needs: [quality-check, build-packages]
    if: needs.quality-check.outputs.should-deploy == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Web App Build
        uses: actions/download-artifact@v4
        with:
          name: web-app-build
          path: packages/web-app/dist/

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/web-app
          vercel-args: '--prod'

  # 🚂 Deploy API Server to Railway
  deploy-api-server:
    name: 🚂 Deploy API Server to Railway
    runs-on: ubuntu-latest
    needs: [quality-check, build-packages]
    if: needs.quality-check.outputs.should-deploy == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download API Server Build
        uses: actions/download-artifact@v4
        with:
          name: api-server-build
          path: packages/api-server/dist/

      - name: 🚂 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚂 Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd packages/api-server
          railway login --token $RAILWAY_TOKEN
          railway deploy --service wishlist-wizard-api

  # 📱 Deploy Mobile PWA to Firebase Hosting
  deploy-mobile-pwa:
    name: 📱 Deploy Mobile PWA to Firebase
    runs-on: ubuntu-latest
    needs: [quality-check, build-mobile]
    if: needs.quality-check.outputs.should-deploy == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Mobile Build
        uses: actions/download-artifact@v4
        with:
          name: mobile-app-build
          path: packages/mobile-app/build/web/

      - name: 🔥 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WISHLIST_WIZARD }}
          channelId: live
          projectId: wishlist-wizard
          entryPoint: packages/mobile-app

  # 🏪 Submit to Chrome Web Store (Manual Trigger)
  submit-chrome-extension:
    name: 🏪 Submit Chrome Extension to Store
    runs-on: ubuntu-latest
    needs: [quality-check, package-extension]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Download Extension Package
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-package
          path: .

      - name: 🏪 Submit to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: wishlist-wizard-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

  # 📊 Deployment Summary
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-web-app, deploy-api-server, deploy-mobile-pwa]
    if: always() && needs.quality-check.outputs.should-deploy == 'true'
    steps:
      - name: 📊 Generate Deployment Report
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web App | ${{ needs.deploy-web-app.result }} | https://wishlist-wizard.vercel.app |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚂 API Server | ${{ needs.deploy-api-server.result }} | https://api.wishlist-wizard.railway.app |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile PWA | ${{ needs.deploy-mobile-pwa.result }} | https://wishlist-wizard.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY