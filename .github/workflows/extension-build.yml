name: Build & Test Browser Extension

permissions:
  contents: read
  issues: write

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: "20"
    secrets:
      chrome_extension_id:
        required: false
      chrome_client_id:
        required: false
      chrome_client_secret:
        required: false
      chrome_refresh_token:
        required: false
  workflow_dispatch:
    inputs:
      project_name:
        description: Project name
        required: true
        default: wishlist-wizard
        type: string
      publish:
        description: Publish the extension after build
        required: false
        default: false
        type: boolean
      node_version:
        description: Node.js version
        required: false
        default: "20"
        type: string

concurrency:
  group: extension-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Browser Extensions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version || '20' }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build extension for all browsers
        run: |
          cd packages/browser-extension
          npm run build:all
      
      - name: Verify builds
        run: |
          cd packages/browser-extension
          
          for browser in chrome edge firefox safari; do
            echo "Verifying $browser build..."
            
            # Check manifest exists
            if [ ! -f "dist/$browser/manifest.json" ]; then
              echo "❌ Missing manifest.json in dist/$browser"
              exit 1
            fi
            
            # Validate manifest JSON
            if ! jq empty "dist/$browser/manifest.json" 2>/dev/null; then
              echo "❌ Invalid JSON in dist/$browser/manifest.json"
              exit 1
            fi
            
            echo "✓ $browser manifest validated"
          done
      
      - name: Check manifest structure
        run: |
          cd packages/browser-extension
          
          echo "=== Chrome Manifest ===" && \
          jq '.manifest_version' dist/chrome/manifest.json && \
          echo "" && \
          echo "=== Firefox Manifest ===" && \
          jq '.manifest_version' dist/firefox/manifest.json && \
          echo "" && \
          echo "=== Safari Manifest ===" && \
          jq '.manifest_version' dist/safari/manifest.json
      
      - name: Run tests
        run: |
          cd packages/browser-extension
          npm run test

      - name: Install Playwright Chromium + xvfb
        run: |
          cd packages/browser-extension
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run E2E tests (extension loaded in a real browser)
        run: |
          cd packages/browser-extension
          xvfb-run --auto-servernum npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-report
          path: packages/browser-extension/test-results/
          retention-days: 7

      - name: Generate manifest comparison report
        if: success()
        run: |
          cd packages/browser-extension
          cat > MANIFEST_COMPARISON.txt << 'EOF'
          # Browser Extension Manifest Comparison
          
          ## Chrome
          EOF
          jq '.' dist/chrome/manifest.json >> MANIFEST_COMPARISON.txt || true
          
          cat >> MANIFEST_COMPARISON.txt << 'EOF'
          
          ## Firefox
          EOF
          jq '.' dist/firefox/manifest.json >> MANIFEST_COMPARISON.txt || true
          
          cat >> MANIFEST_COMPARISON.txt << 'EOF'
          
          ## Safari
          EOF
          jq '.' dist/safari/manifest.json >> MANIFEST_COMPARISON.txt || true
      
      - name: Upload builds as artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: packages/browser-extension/dist/
          retention-days: 30
      
      - name: Create deployment packages
        if: success()
        run: |
          cd packages/browser-extension
          
          # Create zip files for each browser
          for browser in chrome edge firefox safari; do
            cd dist/$browser
            zip -r "../wishlist-wizard-${browser}-$(date +%Y%m%d).zip" .
            cd ../..
            echo "✓ Created wishlist-wizard-${browser}-*.zip"
          done
      
      - name: Upload deployment packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: extension-deployment-packages
          path: packages/browser-extension/dist/*.zip
          retention-days: 90

      - name: Publish to Chrome Web Store
        if: success() && inputs.publish == true
        env:
          CHROME_EXTENSION_ID: ${{ secrets.chrome_extension_id }}
          CHROME_CLIENT_ID: ${{ secrets.chrome_client_id }}
          CHROME_CLIENT_SECRET: ${{ secrets.chrome_client_secret }}
          CHROME_REFRESH_TOKEN: ${{ secrets.chrome_refresh_token }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ] || [ -z "$CHROME_CLIENT_ID" ] || [ -z "$CHROME_CLIENT_SECRET" ] || [ -z "$CHROME_REFRESH_TOKEN" ]; then
            echo "❌ Chrome Web Store publish secrets are not fully configured."
            echo "   Required: chrome_extension_id, chrome_client_id, chrome_client_secret, chrome_refresh_token."
            echo "   The first-ever Chrome Web Store listing must be created manually via the"
            echo "   Developer Dashboard before these can point at anything real; the refresh"
            echo "   token requires a one-time interactive OAuth consent flow and can't be"
            echo "   generated headlessly in CI."
            exit 1
          fi

          # Uses dist/chrome from the build:all output above, not the
          # separate root-level `npm run package:extension:release` flow
          # (a different, flat single-vite-build dist/ shape used only for
          # local ad-hoc packaging).
          npx chrome-webstore-upload-cli upload \
            --source packages/browser-extension/dist/chrome \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"

          npx chrome-webstore-upload-cli publish \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"
          # Firefox AMO / Edge Add-ons publishing could follow this same
          # upload-then-publish shape with their own CLIs (web-ext for AMO,
          # the Partner Center API for Edge) — deliberately out of scope
          # this round.

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && success()
        continue-on-error: true # informational only — this repo's default
          # workflow token is read-only, so issues:write here is capped
          # below what createComment needs unless a PAT is wired in later
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const comment = `## ✓ Browser Extension Build Successful
            
            All 4 browser extensions have been built and verified:
            
            - ✓ **Chrome** (Manifest V3) - Ready for Web Store
            - ✓ **Edge** (Manifest V3) - Ready for Edge Add-ons
            - ✓ **Firefox** (Manifest V2) - Ready for Add-ons Store
            - ✓ **Safari** (Manifest V3) - Ready for App Store
            
            ### Download Artifacts
            
            Extension builds are available in the artifacts section:
            
            1. \`extension-builds/\` - Full build directories for testing
            2. \`extension-deployment-packages/\` - Zip files for store submission
            
            ### Next Steps
            
            To submit to stores:
            
            1. Download \`extension-deployment-packages\`
            2. Follow the store-specific guidelines in \`docs/EXTENSION_STORE_SUBMISSION_DETAILED_RUNBOOK.md\`
            3. Submit \`wishlist-wizard-chrome-*.zip\` to Chrome Web Store
            4. Submit \`wishlist-wizard-firefox-*.zip\` to Mozilla Add-ons
            5. Submit \`wishlist-wizard-edge-*.zip\` to Microsoft Edge Store
            6. Create Xcode project with \`dist/safari/\` files for iOS App Store
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  manifest-diff:
    name: Manifest Differences Report
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: extension-builds
          path: builds/
      
      - name: Generate comparison report
        run: |
          echo "# Browser Extension Manifest Comparison" > /tmp/report.md
          echo "" >> /tmp/report.md
          
          echo "## Overview" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "| Feature | Chrome | Firefox | Safari | Edge |" >> /tmp/report.md
          echo "|---------|--------|---------|--------|------|" >> /tmp/report.md
          
          # Check manifest versions
          chrome_version=$(jq -r '.manifest_version' builds/chrome/manifest.json 2>/dev/null || echo "N/A")
          firefox_version=$(jq -r '.manifest_version' builds/firefox/manifest.json 2>/dev/null || echo "N/A")
          safari_version=$(jq -r '.manifest_version' builds/safari/manifest.json 2>/dev/null || echo "N/A")
          edge_version=$(jq -r '.manifest_version' builds/edge/manifest.json 2>/dev/null || echo "N/A")
          
          echo "| Manifest Version | $chrome_version | $firefox_version | $safari_version | $edge_version |" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "## Details" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "See artifact builds for full manifests." >> /tmp/report.md
          
          cat /tmp/report.md
      
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manifest-comparison-report
          path: /tmp/report.md

  notify-success:
    name: Build Notification
    runs-on: ubuntu-latest
    if: success()
    needs: [build]
    
    steps:
      - name: Post success message
        run: |
          echo "✓ Browser Extension Build Pipeline Completed Successfully"
          echo ""
          echo "All 4 browser extensions built and ready for:"
          echo "  • Chrome Web Store (Manifest V3)"
          echo "  • Mozilla Add-ons (Manifest V2)"
          echo "  • Microsoft Edge Store (Manifest V3)"  
          echo "  • Apple App Store (Manifest V3)"
          echo ""
          echo "Download artifacts to proceed with store submissions."
