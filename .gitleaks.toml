title = "wishlist-wizard gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public Firebase client configuration required by mobile and extension clients"
paths = [
  '''packages/mobile/lib/firebase_options\.dart''',
  '''packages/mobile/android/app/google-services(\.(dev|prod|staging))?\.json''',
  '''packages/mobile/ios/Runner/GoogleService-Info(\.(dev|prod|staging))?\.plist''',
  '''packages/mobile/(ios|macos)/Podfile\.lock''',
  '''packages/mobile-app/ios/Podfile\.lock''',
  '''packages/browser-extension/src/background\.js''',
  # Metadata file: comments here describe past false positives by quoting
  # the exact matched text, which otherwise makes this file itself a new
  # match on every commit that touches it. Never contains real secrets.
  '''\.gitleaksignore''',
]
regexes = [
  '''AIza[0-9A-Za-z_-]{20,}''',
]
