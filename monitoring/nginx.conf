events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /status {
            access_log off;
            return 200 "GitHub Actions Runner Status\n\nService: Active\nContainer: wishlist-wizard-runner\nNetwork: runner-network\nLabels: self-hosted,linux,x64,wishlist-wizard\n\nLast checked: $(date)\n";
            add_header Content-Type text/plain;
        }
    }
}